<svg viewBox="0 0 900 1160" width="2700" height="3480" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="1160" fill="#1a1a1a"/>

<text x="450" y="22" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ccc">Nanuk 933 Transport Case — Layout Plan</text>
<text x="450" y="37" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#666">interior 18×13in · lid depth 2.1in · base depth 7.3in · all dims in inches · scale 30px/in · top-down views</text>

<!-- ══════════════ PANEL 1: BASE LAYER ══════════════ -->
<text x="30" y="66" font-family="monospace" font-size="11" font-weight="bold" fill="#f0b429">BASE LAYER — semi-permanent mount (7.3in usable depth)</text>

<!-- case interior outline: 18 x 13in @ 30px/in = 540 x 390 -->
<rect x="30" y="76" width="540" height="390" fill="#101010" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="300" y="72" text-anchor="middle" font-family="monospace" font-size="7" fill="#555">18 in</text>
<text x="18" y="271" text-anchor="middle" font-family="monospace" font-size="7" fill="#555" transform="rotate(-90,18,271)">13 in</text>

<!-- Pole Node A: 10.5 x 3.5in = 315 x 105px -->
<rect x="30" y="76" width="315" height="105" fill="#1c3d1c" stroke="#4caa4c" stroke-width="1.2" rx="3"/>
<text x="187" y="122" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#88ee88">POLE NODE — A</text>
<text x="187" y="136" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#66bb66">10.5 × 3.5 × 2.75 in</text>

<!-- Pole Node B: directly below, small gap -->
<rect x="30" y="186" width="315" height="105" fill="#1c3d1c" stroke="#4caa4c" stroke-width="1.2" rx="3"/>
<text x="187" y="232" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#88ee88">POLE NODE — B</text>
<text x="187" y="246" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#66bb66">10.5 × 3.5 × 2.75 in</text>

<!-- Spare/cable coil zone below the two pole nodes -->
<rect x="30" y="296" width="315" height="170" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,3" rx="3"/>
<text x="187" y="376" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">SPARE SPACE</text>
<text x="187" y="390" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">DMX/strip pigtails, tools, patch cables</text>

<!-- Electronics zone (right strip): 7.5in wide x 13in tall = 225 x 390 -->
<rect x="345" y="76" width="225" height="390" fill="none" stroke="#40a0ff" stroke-width="1" stroke-dasharray="4,3" rx="3"/>
<text x="457" y="90" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#40a0ff">ELECTRONICS ZONE — 7.5 × 13 in</text>

<!-- Battery bank: 5.75 x 3in = 172.5 x 90 -->
<rect x="360" y="100" width="172" height="90" fill="#2a1a4a" stroke="#7a5add" stroke-width="1.2" rx="3"/>
<text x="446" y="140" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#bb99ff">Pi BATTERY BANK</text>
<text x="446" y="154" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#9977cc">5.75 × 3 × 1.25 in</text>

<!-- Pi: official RPi4 board 3.35 x 2.2in -->
<rect x="360" y="200" width="100" height="66" fill="#204020" stroke="#66cc66" stroke-width="1.2" rx="3"/>
<text x="410" y="228" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#88ee88">Pi</text>
<text x="410" y="240" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#66bb66">RPi4B · 3.35×2.2in</text>
<text x="410" y="250" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#66bb66">board only</text>

<!-- Charger / wiring junction zone: remaining space in strip -->
<rect x="360" y="276" width="196" height="180" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="3,3" rx="3"/>
<text x="458" y="356" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa">CHARGER + WIRING</text>
<text x="458" y="370" text-anchor="middle" font-family="monospace" font-size="7" fill="#777">terminal block, fuse/breaker,</text>
<text x="458" y="382" text-anchor="middle" font-family="monospace" font-size="7" fill="#777">bulkhead pigtails land here</text>

<!-- Bulkhead wall marker on right edge (x=570) -->
<line x1="570" y1="76" x2="570" y2="466" stroke="#f0b429" stroke-width="2.5"/>
<text x="580" y="80" font-family="monospace" font-size="7.5" fill="#f0b429" font-weight="bold">← BULKHEAD WALL</text>
<text x="580" y="92" font-family="monospace" font-size="6.5" fill="#ccaa66">(same wall as existing</text>
<text x="580" y="102" font-family="monospace" font-size="6.5" fill="#ccaa66">IEC inlet — see Panel 3)</text>

<!-- ══════════════ PANEL 2: LID LAYER ══════════════ -->
<text x="30" y="502" font-family="monospace" font-size="11" font-weight="bold" fill="#f0b429">LID LAYER — packed only, not mounted (2.1in usable depth)</text>
<rect x="30" y="512" width="540" height="390" fill="#101010" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>

<!-- StreamDeck: 4.75 x 3.25in = 142.5 x 97.5 -->
<rect x="50" y="532" width="142" height="97" fill="#1a2a5a" stroke="#4a5aaa" stroke-width="1.2" rx="3"/>
<text x="121" y="574" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#8898ee">STREAM DECK</text>
<text x="121" y="588" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#6878cc">4.75 × 3.25 × 1.25 in</text>
<text x="121" y="600" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5566aa">travel slot only —</text>
<text x="121" y="611" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#5566aa">runs OUTSIDE box via USB-A→C</text>

<!-- iPad mini: approx 8.3 x 5.3in -->
<rect x="220" y="532" width="249" height="159" fill="#1a3a5a" stroke="#3a6aaa" stroke-width="1.2" rx="3"/>
<text x="344" y="606" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#70aaee">iPAD MINI</text>
<text x="344" y="620" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#5088cc">≈ 8.3 × 5.3 in (unconfirmed)</text>
<text x="344" y="632" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#4a76b0">powers from bulkhead USB-C</text>

<!-- Cable zone -->
<rect x="50" y="649" width="419" height="233" fill="none" stroke="#888" stroke-width="0.75" stroke-dasharray="3,3" rx="3"/>
<text x="259" y="760" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa">CABLES</text>
<text x="259" y="774" text-anchor="middle" font-family="monospace" font-size="7" fill="#777">USB-A→C (Stream Deck) · HDMI · 3.5mm · AC cord to PA</text>

<!-- ══════════════ PANEL 3: BULKHEAD WALL ELEVATION ══════════════ -->
<text x="30" y="938" font-family="monospace" font-size="11" font-weight="bold" fill="#f0b429">BULKHEAD WALL — grouped on the panel with the existing IEC inlet</text>
<rect x="30" y="958" width="540" height="70" fill="#181818" stroke="#555" stroke-width="1.5" rx="3"/>

<circle cx="80" cy="993" r="15" fill="#1a3a5a" stroke="#3a6aaa" stroke-width="1.2"/>
<text x="80" y="998" text-anchor="middle" font-family="monospace" font-size="7" fill="#70aaee">IEC</text>
<text x="80" y="1042" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">EXISTING</text>
<text x="80" y="1053" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">AC INLET</text>

<circle cx="200" cy="993" r="15" fill="#204020" stroke="#66cc66" stroke-width="1.2"/>
<text x="200" y="998" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#88ee88">WiFi</text>
<text x="200" y="1042" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">ANTENNA</text>
<text x="200" y="1053" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">RP-SMA bulkhead</text>

<circle cx="320" cy="993" r="15" fill="#3d1c1c" stroke="#cc6666" stroke-width="1.2"/>
<text x="320" y="998" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ee8888">AC</text>
<text x="320" y="1042" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">110V OUTLET</text>
<text x="320" y="1053" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">fed from IEC, fused</text>

<rect x="418" y="978" width="64" height="30" rx="4" fill="#2a1a4a" stroke="#7a5add" stroke-width="1.2"/>
<text x="450" y="996" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#bb99ff">COMBO</text>
<text x="450" y="1042" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">HDMI + USB-A + USB-C</text>
<text x="450" y="1053" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">deck cable · iPad power</text>

<circle cx="530" cy="993" r="15" fill="#3d2a1c" stroke="#cc9966" stroke-width="1.2"/>
<text x="530" y="998" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#eebb88">3.5</text>
<text x="530" y="1042" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">3.5mm AUDIO</text>
<text x="530" y="1053" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">line out to PA</text>

<!-- Legend / notes -->
<rect x="30" y="1075" width="540" height="75" fill="#111" rx="3" opacity="0.6"/>
<text x="40" y="1090" font-family="monospace" font-size="8" fill="#999" font-weight="bold">NOTES</text>
<text x="40" y="1104" font-family="monospace" font-size="7" fill="#aaa">• iPad mini dims are an estimate — confirm generation before cutting a slot to fit.</text>
<text x="40" y="1116" font-family="monospace" font-size="7" fill="#aaa">• Charger brick dims unknown — space reserved is generous but unconfirmed to spec.</text>
<text x="40" y="1128" font-family="monospace" font-size="7" fill="#aaa">• Confirm case interior is empty/foam/dividers before committing to a mounting method.</text>
<text x="40" y="1140" font-family="monospace" font-size="7" fill="#aaa">• Inline fuse or breaker between IEC inlet and the new 110V outlet — verify existing wiring gauge.</text>
</svg>
