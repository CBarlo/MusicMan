<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM — Closest to the Mark</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root {
    --bg:        #0f1117;
    --bg2:       #161921;
    --bg3:       #1d2130;
    --surface:   #232838;
    --border:    #2e3448;
    --border2:   #404868;
    --text:      #e8ecf4;
    --text-dim:  #6b7494;
    --amber:     #F5A623;
    --amber-dim: rgba(245,166,35,.15);
    --green:     #3CB96A;
    --green-dim: rgba(60,185,106,.15);
    --red:       #E83A3A;
    --red-dim:   rgba(232,58,58,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    min-height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .heading { font-family:'Barlow Condensed','Arial Narrow',sans-serif; }

  /* ── CONTROLLER ── */
  .stage {
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:20px 20px 28px;
  }
  .brand-row { display:flex; align-items:center; gap:12px; width:100%; max-width:560px; margin-bottom:6px; }
  .brand-badge {
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:var(--amber-dim); border:1px solid var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:800; letter-spacing:1px; color:var(--amber); line-height:1.1; }
  .brand-sub  { font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .config-name { margin-left:auto; font-size:11px; letter-spacing:1px; color:var(--text-dim); text-align:right; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .status-badge {
    width:100%; max-width:560px; margin-top:18px;
    border-radius:16px; padding:22px 20px; text-align:center;
    border:2px solid var(--border2); background:var(--surface);
    transition:background .25s, border-color .25s;
  }
  .status-badge.running { border-color:var(--green); background:var(--green-dim); }
  .status-badge.stopped { border-color:var(--red);   background:var(--red-dim); }
  .status-label { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:14px; letter-spacing:3px; }
  .status-badge.running .status-label { color:var(--green); }
  .status-badge.stopped .status-label { color:var(--red); }
  .cm-display {
    font-family:'Share Tech Mono',monospace; font-weight:700;
    font-size:52px; line-height:1.15; color:var(--text); letter-spacing:1px;
  }
  .cm-target { font-size:11px; letter-spacing:1px; color:var(--text-dim); margin-top:4px; }

  .admin { width:100%; max-width:560px; margin-top:18px; }
  .field-label { display:block; font-size:10px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:5px; font-weight:700; text-transform:uppercase; }
  .mm-input {
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:10px;
  }
  .btn-row { display:flex; gap:10px; }
  .mm-btn {
    flex:1; padding:16px 10px; border-radius:10px; border:1px solid var(--border2);
    background:var(--bg3); color:var(--text); font-family:'Barlow Condensed',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:1px; cursor:pointer;
  }
  .mm-btn:active { filter:brightness(1.2); }
  .mm-btn.start  { border-color:var(--green); background:var(--green-dim); color:var(--green); }
  .mm-btn.stop   { border-color:var(--red);   background:var(--red-dim);   color:var(--red); }
  .mm-btn.record { border-color:var(--amber); background:var(--amber-dim); color:var(--amber); }
  .mm-btn.small  { padding:10px; font-size:12px; }
  .mm-btn:disabled { opacity:.4; cursor:default; }
  .reset-row { margin-top:10px; display:flex; gap:10px; }
  .reset-row .mm-btn { background:var(--bg2); color:var(--text-dim); font-size:12px; padding:10px; }

  .chip-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .chip-empty { color:var(--text-dim); font-size:12px; font-style:italic; }
  .chip {
    flex:0 0 auto; padding:14px 18px; border-radius:10px; border:1px solid var(--amber);
    background:var(--amber-dim); color:var(--amber); font-family:'Barlow Condensed',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:1px; cursor:pointer; min-width:88px; text-align:center;
  }
  .chip:active { filter:brightness(1.2); }
  .chip:disabled { opacity:.35; cursor:default; border-color:var(--border2); background:var(--bg3); color:var(--text-dim); }

  .results-hdr { display:flex; align-items:center; justify-content:space-between; margin-top:22px; margin-bottom:8px; }
  .results-title { font-size:10px; letter-spacing:2px; color:var(--text-dim); font-weight:700; text-transform:uppercase; }
  .lb-table { width:100%; border-collapse:collapse; font-family:'Barlow Condensed',sans-serif; }
  .lb-table th { padding:6px 8px; font-size:9px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; border-bottom:1px solid var(--border); text-align:left; }
  .lb-table td { padding:8px; font-size:14px; border-bottom:1px solid var(--border); }
  .lb-table tr:last-child td { border-bottom:none; }
  .lb-empty { color:var(--text-dim); font-size:11px; font-family:'Share Tech Mono',monospace; padding:16px; text-align:center; letter-spacing:2px; }
  .footer-hint { margin-top:16px; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:center; }

  /* ── DISPLAY MODE ── */
  .display-mode .stage { display:none !important; }
  #dm { display:none; position:fixed; inset:0; overflow:hidden; background:#060814; }
  .display-mode #dm { display:block; }
  #dm-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  #dm-bg::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 30%, rgba(0,0,0,.15) 0%, rgba(6,8,20,.72) 100%); }
  #dm-header { position:absolute; top:5vh; left:4vw; right:4vw; text-align:center; z-index:5; display:flex; flex-direction:column; gap:1.5vh; }
  #dm-title { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:6.5vh; line-height:1.1; letter-spacing:.3vh; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.8); }
  /* Read from across a field, not up close -- the projector's own audience
     copy, distinct from the tiny M5Stick screen's own instruction text. */
  #dm-hint  { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:min(5vh,7vw); letter-spacing:.15vh; color:var(--amber); text-shadow:0 3px 16px rgba(0,0,0,.7); margin-top:.5vh; }

  /* Timer style */
  #dm-timer { display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column; z-index:4; }
  #dm-timer-num { font-family:'Share Tech Mono',monospace; font-weight:700; font-size:min(26vh,22vw); color:var(--amber); text-shadow:0 0 6vh rgba(245,166,35,.55), 0 6px 24px rgba(0,0,0,.7); line-height:1; max-width:92vw; text-align:center; }

  /* Meter style */
  #dm-meter { display:none; position:absolute; left:8vw; right:8vw; top:50%; transform:translateY(-50%); z-index:4; }
  /* No background/border of its own -- the meter's "tube" is whatever the
     config's own background image draws. Only the moving position line, the
     fixed target line, and the start dot render anything here. */
  #dm-meter-track { position:relative; width:100%; height:9vh; }
  #dm-meter-fill  { position:absolute; inset:0; width:0%; background:var(--red); border-radius:5vh; transition:none; }
  /* No box-shadow glow here (unlike dm-meter-start's red one) -- a translucent
     WHITE blur inside this transformed meter container is what rendered as a
     solid black bar on the projector's Android WebView (an alpha-premultiply
     bug some GPU drivers have specifically with near-white rgba blur; a
     colored glow just looks subtly off instead of inverting outright). Solid
     opaque white, no alpha, no blur -- nothing left for that math to get wrong. */
  #dm-meter-target { position:absolute; top:-1.5vh; bottom:-1.5vh; width:0.6vh; background:#fff; }
  #dm-meter-target-label { position:absolute; bottom:100%; left:0; transform:translateX(-50%); margin-bottom:0.8vh;
    font-family:'Share Tech Mono',monospace; font-weight:700; font-size:min(2.6vh,3.6vw); color:#fff;
    white-space:nowrap; text-shadow:0 3px 12px rgba(0,0,0,.8); }
  #dm-meter-start { position:absolute; top:50%; left:0; width:5vh; height:5vh; border-radius:50%; background:var(--red); transform:translate(-50%,-50%); box-shadow:0 0 2vh rgba(232,58,58,.9); border:2px solid #fff; }
  .dm-dial-light.start { border-color:var(--green); box-shadow:0 0 2vh rgba(60,185,106,.8); }
  #dm-meter-num { text-align:center; margin-top:3vh; font-family:'Share Tech Mono',monospace; font-weight:700; font-size:min(12vh,10vw); color:#fff; text-shadow:0 6px 24px rgba(0,0,0,.7); }

  /* Dial style */
  #dm-dial { display:none; position:absolute; inset:0; align-items:center; justify-content:center; z-index:4; }
  #dm-dial-wrap { position:relative; width:62vh; height:62vh; }
  .dm-dial-light { position:absolute; width:3.4vh; height:3.4vh; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.28); transform:translate(-50%,-50%); }
  .dm-dial-light.lit { background:var(--amber); border-color:#fff; box-shadow:0 0 3vh rgba(245,166,35,.9); }
  .dm-dial-light.target { border-color:#fff; box-shadow:0 0 2vh rgba(255,255,255,.7); }
  #dm-dial-num { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Share Tech Mono',monospace; font-weight:700; font-size:min(9vh,9vw); color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.7); max-width:80%; text-align:center; }

  /* Reveal overlay */
  #dm-reveal { display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column; z-index:10; background:rgba(6,8,20,.6); padding:0 5vw; box-sizing:border-box; }
  #dm-reveal-msg { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:min(9vh,12vw); letter-spacing:.2vh; text-align:center; text-shadow:0 6px 30px rgba(0,0,0,.8); max-width:100%; word-break:break-word; }
  #dm-reveal-sub { margin-top:2vh; font-size:min(3.2vh,5vw); color:rgba(255,255,255,.85); letter-spacing:.1vh; text-align:center; max-width:100%; word-break:break-word; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand-row">
    <div class="brand-badge">🎯</div>
    <div>
      <div class="brand-name">CLOSEST TO THE MARK</div>
      <div class="brand-sub">MusicMan</div>
    </div>
    <div class="config-name" id="configName"></div>
  </div>

  <div class="status-badge stopped" id="statusBadge">
    <div class="status-label" id="statusLabel">STOPPED</div>
    <div class="cm-display" id="cmDisplay">—</div>
    <div class="cm-target" id="cmTarget"></div>
  </div>

  <div class="admin">
    <div class="btn-row" style="margin-top:14px">
      <button class="mm-btn start" id="cmStartBtn" onclick="cmToggle()">▶ START</button>
    </div>
    <div class="reset-row">
      <button class="mm-btn" onclick="cmReset()">↺ RESET</button>
    </div>

    <div class="results-hdr" style="margin-top:18px">
      <span class="results-title">Tap who just went — records instantly, no typing</span>
    </div>
    <div id="pendingChips" class="chip-grid"></div>

    <details style="margin-top:14px">
      <summary class="field-label" style="cursor:pointer;display:list-item">Not on the list?</summary>
      <input type="text" id="nameInput" class="mm-input" list="pendingNamesList" placeholder="Who just went?" style="margin-top:8px" onkeydown="if(event.key==='Enter')recordResult()">
      <datalist id="pendingNamesList"></datalist>
      <button class="mm-btn record" id="recordBtn" style="width:100%" disabled onclick="recordResult()">🎯 RECORD RESULT</button>
    </details>

    <div class="results-hdr">
      <span class="results-title">Results — closest first</span>
    </div>
    <div id="resultsList"></div>

    <div class="reset-row">
      <button class="mm-btn small" onclick="showOnHDMI()">📺 SHOW ON HDMI</button>
      <button class="mm-btn small" onclick="hideFromHDMI()">🚫 HIDE FROM HDMI</button>
      <button class="mm-btn small" onclick="clearResults()">🗑 CLEAR RESULTS</button>
    </div>
    <div class="footer-hint">MC starts/stops from the remote or here. Tap a contestant chip above to record their result -- no typing mid-round.</div>
  </div>
</div>

<div id="dm">
  <div id="dm-bg"></div>
  <div id="dm-header">
    <div id="dm-title"></div>
    <div id="dm-hint"></div>
  </div>

  <div id="dm-timer"><div id="dm-timer-num">0</div></div>

  <div id="dm-meter">
    <div id="dm-meter-track"><div id="dm-meter-fill"></div><div id="dm-meter-target"><div id="dm-meter-target-label"></div></div><div id="dm-meter-start"></div></div>
    <div id="dm-meter-num">0</div>
  </div>

  <div id="dm-dial"><div id="dm-dial-wrap"><div id="dm-dial-num">0</div></div></div>

  <div id="dm-reveal"><div id="dm-reveal-msg"></div><div id="dm-reveal-sub"></div></div>
</div>

<script>
let _isDisplay = false;
const _inIframe = window.top !== window.self;
let _configId  = null;
let _cfgData   = {};
let _bucket    = '';
let _results   = [];

// ── VALUE MATH — must exactly match _closest_value_at() in musicman.py ──
function closestValueAt(cfg, elapsedMs) {
  const lo = Number(cfg.min_value ?? 0), hi = Number(cfg.max_value ?? 100);
  const span = hi - lo;
  const secs = Math.max(0.1, Number(cfg.speed ?? 6));
  const t = (elapsedMs / 1000) / secs;
  let frac;
  if (cfg.motion === 'bounce') { const cyc = t % 2; frac = cyc <= 1 ? cyc : 2 - cyc; }
  else if (cfg.motion === 'loop') { frac = ((t % 1) + 1) % 1; }
  else { frac = Math.min(1, t); }
  return lo + span * frac;
}
function fmtVal(v) {
  const dec = Number(_cfgData.decimals ?? 0);
  return Number(v ?? 0).toFixed(dec);
}
function unitSuffix() { return _cfgData.unit_label ? ' ' + _cfgData.unit_label : ''; }

// ── STATE (mirrors games_timedcomp.html's stopwatch handling) ──
let cmRunning = false, cmStartMs = null, cmStoppedValue = null, cmInterval = null, cmCountdown = 0;

function cmToggle() {
  if (!cmRunning && !cmCountdown) {
    fetch('/api/games/closest/start', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ config_id: _configId }) }).catch(() => {});
  } else {
    fetch('/api/games/closest/stop', { method: 'POST' }).catch(() => {});
  }
}
function cmReset() {
  fetch('/api/games/closest/reset', { method: 'POST' }).catch(() => {});
}

function applyClosestState(cs) {
  const wasRunning = cmRunning, wasCountdown = cmCountdown;
  cmRunning = !!cs.running;
  cmCountdown = cs.countdown || 0;
  cmStartMs = cs.start_ms || null;
  cmStoppedValue = (cs.stopped_value != null) ? cs.stopped_value : null;
  setButtons();
  // 3-2-1 runs before running flips true -- the meter/timer/dial simply
  // doesn't move yet (liveValue() only reacts to cmRunning), so no separate
  // "don't animate" guard is needed, just showing/hiding this overlay.
  if (cmCountdown) showCountdown(cmCountdown);
  else if (wasCountdown) hideCountdown();   // STOP/RESET cancelled it before running began
  if (cmRunning && !wasRunning) { hideCountdown(); hideReveal(); }
  if (!cmRunning && wasRunning && cmStoppedValue != null) showReveal(cmStoppedValue);
  tick();
}

function liveValue() {
  if (cmRunning && cmStartMs) return closestValueAt(_cfgData, Date.now() - cmStartMs);
  if (cmStoppedValue != null) return cmStoppedValue;
  return Number(_cfgData.min_value ?? 0);
}

function setButtons() {
  const badge = document.getElementById('statusBadge');
  const label = document.getElementById('statusLabel');
  const btn   = document.getElementById('cmStartBtn');
  badge.classList.toggle('running', cmRunning);
  badge.classList.toggle('stopped', !cmRunning);
  label.textContent = cmCountdown ? ('STARTING IN ' + cmCountdown + '...') : (cmRunning ? 'RUNNING' : 'STOPPED');
  btn.textContent = (cmRunning || cmCountdown) ? '⏹ STOP' : '▶ START';
  btn.classList.toggle('start', !cmRunning && !cmCountdown);
  btn.classList.toggle('stop', cmRunning || cmCountdown);
  document.getElementById('recordBtn').disabled = (cmStoppedValue == null);
  renderPendingChips();   // chips enable/disable with cmStoppedValue -- must re-run on every STOP/START, not just when _results changes
}

// ── CONTROLLER READOUT ──
function renderController() {
  document.getElementById('cmDisplay').textContent = fmtVal(liveValue()) + unitSuffix();
  const t = _cfgData.target_value;
  document.getElementById('cmTarget').textContent = (t != null) ? ('Target: ' + fmtVal(t) + unitSuffix()) : '';
}

// ── DISPLAY RENDER ──
function renderDisplay() {
  const v = liveValue();
  const lo = Number(_cfgData.min_value ?? 0), hi = Number(_cfgData.max_value ?? 100);
  const span = (hi - lo) || 1;
  const pct = Math.max(0, Math.min(1, (v - lo) / span));
  const style = _cfgData.style || 'timer';
  // The giant timer/dial numbers stay unit-free -- the header's own unit line
  // already says it, and appending it at 26vh/9vh font routinely overflowed
  // the screen (confirmed live: "24.0 inches" at 26vh bled off both edges).
  document.getElementById('dm-timer-num').textContent = fmtVal(v);
  document.getElementById('dm-meter-num').textContent = fmtVal(v) + unitSuffix();
  document.getElementById('dm-meter-fill').style.width = (pct * 100) + '%';
  document.getElementById('dm-dial-num').textContent = fmtVal(v);
  if (style === 'dial') {
    const n = 24;
    const lightIdx = Math.round(pct * n) % n;
    document.querySelectorAll('.dm-dial-light').forEach((el, i) => el.classList.toggle('lit', i === lightIdx));
  }
}

function tick() {
  if (_isDisplay) renderDisplay(); else renderController();
  if (cmRunning) requestAnimationFrame(tick);
}

// ── REVEAL ──
// Deliberately no "NAILED IT"/"SO CLOSE"/"OFF THE MARK" verdict -- Chris's
// call: this isn't a per-attempt judgment, it's one entry in a field of
// contestants, and the actual result (who's closest) only means anything
// once everyone's gone and it's ranked in the results list. Just the plain
// landed number and the target, frozen on screen.
function showReveal(value) {
  if (!_isDisplay) return;
  document.getElementById('dm-hint').style.visibility = 'hidden';
  const target = Number(_cfgData.target_value ?? 0);
  document.getElementById('dm-reveal-msg').textContent = fmtVal(value) + unitSuffix();
  document.getElementById('dm-reveal-msg').style.color = '#fff';
  document.getElementById('dm-reveal-sub').textContent = 'Target was ' + fmtVal(target) + unitSuffix();
  document.getElementById('dm-reveal').style.display = 'flex';
}
function hideReveal() {
  document.getElementById('dm-reveal').style.display = 'none';
  document.getElementById('dm-hint').style.visibility = 'visible';
}

// ── 3-2-1 COUNTDOWN (reuses the reveal overlay -- they never overlap in time:
// countdown is pre-round, reveal is post-round) ──
function showCountdown(n) {
  if (!_isDisplay) return;
  document.getElementById('dm-hint').style.visibility = 'hidden';
  document.getElementById('dm-reveal-msg').textContent = String(n);
  document.getElementById('dm-reveal-msg').style.color = _cfgData.bar_color || 'var(--red)';
  document.getElementById('dm-reveal-sub').textContent = 'GET READY...';
  document.getElementById('dm-reveal').style.display = 'flex';
}
function hideCountdown() {
  document.getElementById('dm-reveal').style.display = 'none';
  document.getElementById('dm-hint').style.visibility = 'visible';
}

// ── RESULTS (games.json bucket named after this config, same
// /api/games/record + /api/games/display pipeline every other game uses) ──
// Pre-seeded names with no recorded distance yet (lbAddContestants() in
// Console) -- the whole point of pre-entering them is tapping a name here
// after a run instead of typing on an iPad mid-game. Also still feeds the
// fallback NAME field's autocomplete for anyone not on this list.
function renderPendingChips() {
  const pendingList = document.getElementById('pendingNamesList');
  const grid = document.getElementById('pendingChips');
  const pending = _results.filter(r => !('distance' in r));
  if (pendingList) {
    pendingList.innerHTML = pending.map(r => `<option value="${escHtmlCm(r.label)}">`).join('');
  }
  if (!grid) return;
  if (!pending.length) { grid.innerHTML = '<div class="chip-empty">No contestants entered yet</div>'; return; }
  const canRecord = cmStoppedValue != null;
  grid.innerHTML = pending.map(r => {
    const labelJson = JSON.stringify(r.label).replace(/"/g, '&quot;');
    return `<button class="chip" ${canRecord ? '' : 'disabled'} onclick='recordResult(${labelJson})'>${escHtmlCm(r.label)}</button>`;
  }).join('');
}

function renderResults() {
  const el = document.getElementById('resultsList');
  renderPendingChips();
  const played = _results.filter(r => 'distance' in r);
  if (!played.length) { el.innerHTML = '<div class="lb-empty">NO RESULTS YET</div>'; return; }
  // Ties broken by who recorded first (matches the server's own sort) -- no
  // ties allowed, someone has to be shown as ahead.
  const sorted = [...played].sort((a, b) => Math.abs(a.distance || 0) - Math.abs(b.distance || 0) || (a.at || 0) - (b.at || 0));
  const rows = sorted.map((r, i) => {
    const valStr = (r.value != null ? Number(r.value).toFixed(Number(_cfgData.decimals ?? 0)) : Math.abs(r.distance).toFixed(1)) + unitSuffix();
    const idJson = JSON.stringify(r.id || '').replace(/"/g, '&quot;');
    return `<tr>
      <td style="text-align:center;color:${i === 0 ? 'var(--amber)' : 'var(--text)'}">${i + 1}.</td>
      <td style="font-weight:700">${escHtmlCm(r.label)}</td>
      <td style="font-family:'Share Tech Mono',monospace;text-align:right;color:${i === 0 ? 'var(--amber)' : 'var(--text)'}">${valStr}</td>
      <td style="text-align:right"><button onclick='deleteResult(${idJson})' style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:2px 5px">✕</button></td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="lb-table"><thead><tr><th style="text-align:center">#</th><th>Name</th><th style="text-align:right">Result</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function escHtmlCm(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// labelOverride: a tapped chip's name -- records instantly, no typing. With
// no argument, falls back to whatever's typed in the "Not on the list?" field.
async function recordResult(labelOverride) {
  if (cmStoppedValue == null) { alert('Stop it first'); return; }
  const label = (labelOverride != null ? labelOverride : (document.getElementById('nameInput').value || '')).trim() || 'Player';
  const target = Number(_cfgData.target_value ?? 0);
  const distance = cmStoppedValue - target;
  try {
    const r = await fetch('/api/games/record', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ game: _bucket, label, distance, value: cmStoppedValue }),
    }).then(r => r.json());
    if (r.ok) { _results = r.games[_bucket] || []; renderResults(); document.getElementById('nameInput').value = ''; }
  } catch (e) {}
}

async function deleteResult(id) {
  try {
    const r = await fetch('/api/games/entry/delete', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ game: _bucket, id }),
    }).then(r => r.json());
    if (r.ok) { _results = r.games[_bucket] || []; renderResults(); }
  } catch (e) {}
}

async function clearResults() {
  if (!confirm('Clear all results for "' + _bucket + '"?')) return;
  try { await fetch('/api/games/clear', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: _bucket }) }); } catch (e) {}
  _results = []; renderResults();
}

function showOnHDMI() {
  fetch('/api/games/display', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    // mode:'distance' -- this game is ALWAYS distance-mode, but the server
    // otherwise has to sniff the mode from whichever entries happen to exist
    // in the bucket, which guessed wrong (defaulted to "FASTEST TIMES") the
    // moment every entry was still a pending pre-seeded name (no distance
    // recorded yet) with nobody having played a round.
    body: JSON.stringify({ game: _bucket, mode: 'distance', unit_label: _cfgData.unit_label || '', decimals: _cfgData.decimals || 0 }),
  }).catch(() => {});
}
function hideFromHDMI() {
  fetch('/api/games/display/hide', { method: 'POST' }).catch(() => {});
}

// ── DISPLAY SETUP (theme, style, dial lights) — runs once config is known ──
function setupDisplayTheme() {
  document.getElementById('dm-title').textContent = _cfgData.title || 'Closest to the Mark';
  if (_cfgData.bar_color) {
    document.getElementById('dm-meter-fill').style.background = _cfgData.bar_color;
    document.getElementById('dm-meter-fill').style.boxShadow = `0 0 2vh ${_cfgData.bar_color}`;
    document.getElementById('dm-meter-start').style.background = _cfgData.bar_color;
    document.getElementById('dm-meter-start').style.boxShadow = `0 0 2vh ${_cfgData.bar_color}`;
  }
  // The mark has to actually be stated, not just implied -- nobody can aim
  // for an abstract "the mark" they were never told. Big and legible from
  // across a field, not the small print this used to be.
  const target = Number(_cfgData.target_value ?? 0);
  document.getElementById('dm-hint').textContent = 'CLOSEST TO ' + fmtVal(target) + unitSuffix() + ' WINS!';
  if (_cfgData.bg_image) {
    // Cache-bust: the projector kiosk stays on this page for hours/days at a
    // stretch and caches this URL by its exact string, so re-uploading a new
    // version of the same filename in Admin (Chris iterating on the
    // thermometer art) silently kept showing the OLD image there -- while a
    // freshly-opened tab (the iPad) fetched the new one. Same reasoning as
    // _gameFrame.src's own '_v=' below and _versioned_walkup_file() server-side.
    document.getElementById('dm-bg').style.backgroundImage =
      `url('/assets/display/${encodeURIComponent(_cfgData.bg_image)}?_v=${Date.now()}')`;
  } else {
    document.getElementById('dm-bg').style.background = 'radial-gradient(ellipse at 50% 20%, #1a2440 0%, #060814 70%)';
  }
  const style = _cfgData.style || 'timer';
  document.getElementById('dm-timer').style.display = style === 'timer' ? 'flex' : 'none';
  document.getElementById('dm-meter').style.display = style === 'meter' ? 'block' : 'none';
  document.getElementById('dm-dial').style.display  = style === 'dial'  ? 'flex'  : 'none';

  const lo = Number(_cfgData.min_value ?? 0), hi = Number(_cfgData.max_value ?? 100);
  const span = (hi - lo) || 1;
  const tPct = Math.max(0, Math.min(1, (target - lo) / span));

  if (style === 'meter') {
    document.getElementById('dm-meter-target').style.left = (tPct * 100) + '%';
    document.getElementById('dm-meter-target-label').textContent = fmtVal(target) + unitSuffix();
  }
  if (style === 'dial') {
    const wrap = document.getElementById('dm-dial-wrap');
    wrap.querySelectorAll('.dm-dial-light').forEach(el => el.remove());
    const n = 24, r = 29; // vh
    const targetIdx = Math.round(tPct * n) % n;
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      const x = 50 + r * Math.cos(angle); // percent -- wrap is a 62vh square, so r in "percent of side" works directly
      const y = 50 + r * Math.sin(angle);
      const el = document.createElement('div');
      el.className = 'dm-dial-light' + (i === targetIdx ? ' target' : '') + (i === 0 ? ' start' : '');
      el.style.left = x + '%'; el.style.top = y + '%';
      wrap.appendChild(el);
    }
  }
}

// ── WEBSOCKET ──
let _ws = null;
function connectWS() {
  _ws = new WebSocket('ws://' + location.host + '/ws');
  _ws.onopen  = () => { if (_isDisplay && !_inIframe) _ws.send(JSON.stringify({event:'page_ready', url: location.pathname})); refreshResults(); };
  _ws.onclose = () => setTimeout(connectWS, 3000);
  _ws.onerror = () => _ws.close();
  _ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.event === 'closest_state') {
        applyClosestState(msg.data || {});
      } else if (msg.event === 'closest_countdown') {
        showCountdown((msg.data || {}).n);
      } else if (msg.event === 'games_state' && _bucket) {
        _results = (msg.data || {})[_bucket] || [];
        renderResults();
      }
    } catch (e) {}
  };
}
connectWS();

async function refreshResults() {
  if (!_bucket) return;
  try {
    const games = await fetch('/api/games').then(r => r.json());
    _results = games[_bucket] || [];
    renderResults();
  } catch (e) {}
}

(async function init() {
  const params = new URLSearchParams(location.search);
  _isDisplay = params.get('display') === '1';
  if (_isDisplay) document.body.classList.add('display-mode');

  _configId = params.get('config');
  if (_configId) {
    try {
      const cfg = await fetch(`/api/game_configs/${_configId}`).then(r => r.json());
      if (cfg && cfg.id) {
        _cfgData = cfg.data || {};
        _bucket  = cfg.name || _configId;
        document.getElementById('configName').textContent = cfg.name;
        document.title = 'MM Closest to the Mark — ' + cfg.name;
      }
    } catch (e) {}
  }
  if (_isDisplay) setupDisplayTheme();

  // Sync to whatever's actually running right now -- covers opening this
  // page mid-event (e.g. a reload, or Console's "jump to active game").
  try {
    const st = await fetch('/api/state').then(r => r.json());
    applyClosestState(st.closest || {});
  } catch (e) {}
  setButtons();
  tick();

  await refreshResults();
})();
</script>
