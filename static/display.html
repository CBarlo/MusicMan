<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Man Display</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:#080808;
    font-family:'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    overflow:hidden;
    color:#fff;
  }

  /* ── LAYERS ────────────────────────────────────────────── */
  #layer-standby,
  #layer-walkup {
    position:fixed;
    inset:0;
  }
  #layer-standby { opacity:1; z-index:1; }
  #layer-walkup  { opacity:0; z-index:2; pointer-events:none; }

  /* ── STANDBY ────────────────────────────────────────────── */
  #layer-standby {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3vh;
    background:#080808;
  }
  #standby-logo {
    max-width:28vw;
    max-height:38vh;
    object-fit:contain;
    display:none;
  }
  #standby-text {
    text-align:center;
    opacity:0.18;
  }
  #standby-title {
    font-size:7vw;
    font-weight:800;
    letter-spacing:0.15em;
    text-transform:uppercase;
    line-height:1;
  }
  #standby-subtitle {
    font-size:2.2vw;
    letter-spacing:0.45em;
    text-transform:uppercase;
    margin-top:1vw;
    font-weight:500;
  }

  /* ── WALKUP ────────────────────────────────────────────── */
  #layer-walkup {
    display:flex;
    flex-direction:column;
  }

  /* Background color wash */
  #wu-bg {
    position:absolute;
    inset:0;
    background:#000;
  }

  /* Full-screen video */
  #wu-video {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:1;
  }

  /* Logo centered */
  #wu-logo-wrap {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  #wu-logo {
    max-width:55vw;
    max-height:70vh;
    object-fit:contain;
    display:none;
    filter:drop-shadow(0 0 4vw rgba(0,0,0,0.5));
  }

  /* Name bar */
  #wu-namebar {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:3vh 5vw 4vh;
    background:linear-gradient(transparent, rgba(0,0,0,0.85) 60%);
    text-align:center;
  }
  #wu-name {
    font-size:8vw;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:0.9;
    text-shadow:0 4px 3vw rgba(0,0,0,0.6);
  }

  /* ── TITLE CARD (macro steps) ──────────────────────────── */
  #layer-title {
    position:fixed;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
  }
  #title-name {
    font-size:12vw;
    font-weight:900;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
    line-height:1;
    padding:0 6vw;
    text-shadow:0 0 8vw currentColor;
    position:relative;
    z-index:2;
  }
  #title-video,
  #title-img-a,
  #title-img-b {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.8s ease;
  }

  /* ── BREATHE ANIMATION on standby ──────────────────────── */
  @keyframes breathe {
    0%, 100% { opacity:0.85; }
    50%       { opacity:1; }
  }
  #standby-logo, #standby-text { animation:breathe 4s ease-in-out infinite; }

  /* ── SLIDE LAYER ─────────────────────────────────────────── */
  #layer-slide {
    position:fixed; inset:0; z-index:4;
    opacity:0; pointer-events:none;
    transition:opacity .7s ease;
    display:flex; align-items:center; justify-content:center;
    background:#060504; overflow:hidden;
  }
  /* BIG TITLE */
  .sl-big          { text-align:center; padding:0 8vw; }
  .sl-big .sl-head { font-size:15vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; line-height:.9; color:var(--sl-a,#F5A623); text-shadow:0 0 8vw currentColor; }
  .sl-big .sl-sub  { font-size:4vw; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.82); margin-top:2vw; }
  /* BULLETIN */
  .sl-bul          { padding:0 10vw; width:100%; }
  .sl-bul .sl-head { font-size:7vw; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 5vw currentColor; line-height:1; }
  .sl-rule         { width:100%; height:3px; background:var(--sl-a,#F5A623); margin:1.5vw 0; opacity:.7; }
  .sl-line         { font-size:3.8vw; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:rgba(255,255,255,.9); line-height:1.6; padding-left:1.5vw; border-left:.5vw solid var(--sl-a,#F5A623); margin:.5vw 0; }
  /* NEXT EVENT */
  .sl-nxt            { text-align:center; padding:0 8vw; }
  .sl-nxt .sl-label  { font-size:2.4vw; font-weight:700; letter-spacing:.5em; text-transform:uppercase; color:rgba(255,255,255,.45); margin-bottom:1.5vw; }
  .sl-nxt .sl-name   { font-size:11vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 7vw currentColor; line-height:.88; margin:1.5vw 0; }
  .sl-nxt .sl-date   { font-size:4.2vw; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.8); margin-top:1.5vw; }
  /* SPOTLIGHT */
  .sl-spot           { display:flex; align-items:center; gap:6vw; padding:0 7vw; width:100%; }
  .sl-spot .sl-img   { max-width:36vw; max-height:72vh; object-fit:contain; filter:drop-shadow(0 0 5vw rgba(0,0,0,.55)); flex-shrink:0; }
  .sl-spot .sl-txt   { flex:1; }
  .sl-spot .sl-head  { font-size:8vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 5vw currentColor; line-height:.88; }
  .sl-spot .sl-sub   { font-size:3.4vw; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-top:2vw; }
  /* QR CODE */
  .sl-qr             { text-align:center; padding:0 8vw; }
  .sl-qr .sl-head    { font-size:6vw; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 4vw currentColor; line-height:1; }
  .sl-qr .sl-body    { font-size:2.6vw; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.65); margin:1.2vw 0; }
  .sl-qr .sl-qimg    { width:24vw; height:24vw; margin:1.2vw auto; display:block; border:1vw solid #fff; border-radius:.6vw; image-rendering:pixelated; }
  .sl-qr .sl-url     { font-size:1.7vw; font-weight:600; letter-spacing:.08em; color:rgba(255,255,255,.38); font-family:'Share Tech Mono','Courier New',monospace; margin-top:.4vw; }

  /* ── VS CARD LAYER ──────────────────────────────────────────── */
  #layer-vs {
    position: fixed; inset: 0; z-index: 7;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    background: #050505;
    display: flex; align-items: stretch;
    overflow: hidden;
  }
  #layer-vs.vs-active { opacity: 1; }

  .vs-half {
    flex: 1; position: relative;
    overflow: hidden;
  }
  .vs-half-left  { transform-origin: left center; }
  .vs-half-right { transform-origin: right center; }

  /* Colour wash behind each player */
  .vs-half::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--vs-color, #E83A3A);
    opacity: .13;
    clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
  }
  .vs-half-right::before {
    clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
  }

  /* Portrait / letter avatar */
  .vs-portrait {
    max-width:  calc(var(--img-scale, 1.0) * 36vw);
    max-height: calc(var(--img-scale, 1.0) * 60vh);
    width: auto; height: auto;
    display: block;
    filter: drop-shadow(0 0 3vw var(--vs-color, #E83A3A));
    border-radius: 4px;
  }
  .vs-letter-avatar {
    width: 32vw; height: 42vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 28vw; font-weight: 900; line-height: 1;
    color: var(--vs-color, #E83A3A);
    text-shadow: 0 0 6vw var(--vs-color, #E83A3A);
    opacity: .9;
  }

  #vs-left-media, #vs-right-media {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Name bar */
  .vs-namebar {
    position: absolute; top: calc(50% + 21vh + 2vh); left: 50%;
    transform: translateX(-50%);
    text-align: center; width: 100%;
    padding: 0 3vw;
  }
  .vs-name {
    font-size: 7.5vw; font-weight: 900; line-height: .9;
    letter-spacing: .06em; text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 4vw var(--vs-color, #E83A3A), 0 4px 0 rgba(0,0,0,.9);
  }
  .vs-sublabel {
    font-size: 2vw; font-weight: 700; letter-spacing: .3em;
    text-transform: uppercase; color: var(--vs-color, #E83A3A);
    opacity: .9; margin-top: .4vh;
  }

  /* VS divider */
  #vs-center {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex; flex-direction: column; align-items: center;
  }
  #vs-text {
    font-size: 14vw; font-weight: 900; line-height: .85;
    letter-spacing: -.02em; font-style: italic;
    color: #fff;
    text-shadow:
      0 0 3vw #fff,
      0 0 8vw #F5A623,
      0 0 18vw #F5A623,
      0 6px 0 rgba(0,0,0,.9);
    animation: vs-pulse 1.6s ease-in-out infinite;
  }
  #vs-divider-line {
    width: 2px; height: 100vh;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(245,166,35,.6) 30%,
      rgba(245,166,35,.8) 50%,
      rgba(245,166,35,.6) 70%,
      transparent 100%);
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    pointer-events: none;
  }

  @keyframes vs-pulse {
    0%,100% { text-shadow: 0 0 3vw #fff, 0 0 8vw #F5A623, 0 0 18vw #F5A623, 0 6px 0 rgba(0,0,0,.9); }
    50%      { text-shadow: 0 0 5vw #fff, 0 0 14vw #F5A623, 0 0 30vw #F5A623, 0 0 50vw rgba(245,166,35,.3), 0 6px 0 rgba(0,0,0,.9); }
  }

  /* Entry animations */
  @keyframes vs-enter-left {
    from { transform: translateX(-110vw) scale(.92); opacity:0; }
    to   { transform: translateX(0)      scale(1);   opacity:1; }
  }
  @keyframes vs-enter-right {
    from { transform: translateX(110vw)  scale(.92); opacity:0; }
    to   { transform: translateX(0)      scale(1);   opacity:1; }
  }
  #layer-vs.vs-active .vs-half-left  { animation: vs-enter-left  1.1s cubic-bezier(.2,0,.4,1) forwards; }
  #layer-vs.vs-active .vs-half-right { animation: vs-enter-right 1.1s cubic-bezier(.2,0,.4,1) forwards; }

  /* Scanline overlay for arcade theme */
  #layer-vs.theme-arcade::after {
    content: '';
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,.18) 3px, rgba(0,0,0,.18) 4px
    );
  }
  /* Neon theme */
  #layer-vs.theme-neon .vs-name { font-family:'Barlow Condensed',sans-serif; }
  #layer-vs.theme-neon #vs-text {
    color: #00ff88;
    text-shadow: 0 0 3vw #00ff88, 0 0 10vw #00ff88, 0 0 24vw #00ff88, 0 6px 0 rgba(0,0,0,.9);
    animation: none;
  }

  /* Nintendo 8-bit (NES) theme */
  #layer-vs.theme-nes {
    background: radial-gradient(ellipse at 50% 30%, #1a0a2e 0%, #0d0221 70%);
  }
  /* Vignette */
  #layer-vs.theme-nes::before {
    content: '';
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.5) 100%);
  }
  /* Scanlines */
  #layer-vs.theme-nes::after {
    content: '';
    position: absolute; inset: 0; z-index: 9; pointer-events: none;
    background: repeating-linear-gradient(rgba(0,0,0,.35) 0 1px, transparent 1px 3px);
    opacity: .35;
  }
  /* Suppress half color wash */
  #layer-vs.theme-nes .vs-half::before { opacity: 0; }
  /* VS text */
  #layer-vs.theme-nes #vs-text {
    font-family: 'Press Start 2P', 'Share Tech Mono', monospace;
    font-style: normal; font-size: 6vw; letter-spacing: 0;
    color: #ff2079;
    text-shadow: 0 0 18px #ff2079, 0 0 4px #fff;
    animation: vs-pulse-nes 1.1s ease-in-out infinite;
  }
  @keyframes vs-pulse-nes {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.12); }
  }
  /* No divider */
  #layer-vs.theme-nes #vs-divider-line { display: none; }
  /* Photo box */
  #layer-vs.theme-nes #vs-left-media,
  #layer-vs.theme-nes #vs-right-media {
    width: 22vw; height: 22vw;
    border: 4px solid #00e5ff;
    box-shadow: 0 0 20px #00e5ff, 0 0 50px rgba(0,229,255,.25), inset 0 0 20px rgba(0,229,255,.08);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #00e5ff, #ff2079);
  }
  /* Pixel grid overlay on photo */
  #layer-vs.theme-nes #vs-left-media::after,
  #layer-vs.theme-nes #vs-right-media::after {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 6px, transparent 6px 12px);
    pointer-events: none; z-index: 1;
  }
  /* Portrait fills box */
  #layer-vs.theme-nes .vs-portrait {
    width: 100%; height: 100%; max-width: none; max-height: none;
    object-fit: cover; border-radius: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
    filter: contrast(1.2) saturate(1.3);
  }
  /* Letter avatar fills box with gradient bg */
  #layer-vs.theme-nes .vs-letter-avatar {
    width: 100%; height: 100%;
    font-family: 'Press Start 2P', 'Share Tech Mono', monospace;
    font-size: 7vw; font-weight: 400;
    color: #fff; text-shadow: none; opacity: 1; background: transparent;
  }
  /* Name moved to top */
  #layer-vs.theme-nes .vs-namebar { top: 6vh; }
  #layer-vs.theme-nes .vs-name {
    font-family: 'Press Start 2P', 'Share Tech Mono', monospace;
    font-size: 2.2vw; font-weight: 400; letter-spacing: 0; line-height: 1.8;
    color: #f4f4f4;
    text-shadow: 0 0 10px #00e5ff;
  }
  #layer-vs.theme-nes .vs-sublabel {
    font-family: 'VT323', 'Share Tech Mono', monospace;
    font-size: 3.5vw; color: #00e5ff; letter-spacing: 2px;
  }

  /* ── HEAD TO HEAD LAYER ─────────────────────────────────────── */
  #layer-h2h {
    position: fixed; inset: 0; z-index: 7;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    background: #050505;
    display: flex; flex-direction: column; align-items: center;
    padding: 2vh 2.5vw;
  }
  #layer-h2h.h2h-active { opacity: 1; }
  #h2h-title {
    flex-shrink: 0;
    font-size: 2.6vw; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.45); margin-bottom: 1.2vh;
  }
  .h2h-grid {
    display: grid; gap: 1.4vw;
    width: 100%; max-width: 92vw; flex: 1; min-height: 0;
  }
  #layer-h2h[data-count="2"] .h2h-grid { grid-template-columns: repeat(2, 1fr); }
  #layer-h2h[data-count="3"] .h2h-grid { grid-template-columns: repeat(3, 1fr); }
  #layer-h2h[data-count="4"] .h2h-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
  #layer-h2h[data-count="5"] .h2h-grid { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); }
  #layer-h2h[data-count="5"] .h2h-tile:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
  #layer-h2h[data-count="5"] .h2h-tile:nth-child(2) { grid-column: 3 / 5; grid-row: 1; }
  #layer-h2h[data-count="5"] .h2h-tile:nth-child(3) { grid-column: 5 / 7; grid-row: 1; }
  #layer-h2h[data-count="5"] .h2h-tile:nth-child(4) { grid-column: 2 / 4; grid-row: 2; }
  #layer-h2h[data-count="5"] .h2h-tile:nth-child(5) { grid-column: 4 / 6; grid-row: 2; }
  #layer-h2h[data-count="6"] .h2h-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }

  .h2h-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #101010; border: 1px solid rgba(255,255,255,.08); border-top: 3px solid var(--h2h-color, #888);
    border-radius: 1.2vw; padding: 1.5vh 1vw; overflow: hidden;
  }
  /* Photo/avatar treatment matches the VS Card layer: natural rectangular aspect,
     drop-shadow glow in the contestant's color — no circular cropping. */
  .h2h-portrait {
    max-width: 82%; width: auto; height: auto; object-fit: contain;
    border-radius: 6px; margin-bottom: 1.2vh;
    filter: drop-shadow(0 0 1vw var(--h2h-color, #888));
  }
  .h2h-avatar {
    width: 66%; margin-bottom: 1.2vh; border-radius: 6px;
    background: color-mix(in srgb, var(--h2h-color, #888) 18%, transparent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; line-height: 1;
    color: var(--h2h-color, #888);
    text-shadow: 0 0 2vw var(--h2h-color, #888);
  }
  .h2h-name {
    flex-shrink: 0;
    font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
    color: rgba(255,255,255,.92); text-align: center; margin-bottom: 1vh;
    max-width: 94%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .h2h-score {
    flex-shrink: 0;
    font-family: 'Share Tech Mono', monospace; font-variant-numeric: tabular-nums;
    font-weight: 700; color: #F5A623;
    transition: transform .15s ease;
  }
  .h2h-portrait, .h2h-avatar { flex-shrink: 1; min-height: 0; }
  .h2h-score.pulse-up   { animation: h2h-pulse-up .5s ease; }
  .h2h-score.pulse-down { animation: h2h-pulse-down .5s ease; }
  @keyframes h2h-pulse-up   { 0% { transform: scale(1); } 30% { transform: scale(1.25); color: #3CB96A; } 100% { transform: scale(1); color: #F5A623; } }
  @keyframes h2h-pulse-down { 0% { transform: scale(1); } 30% { transform: scale(1.25); color: #E83A3A; } 100% { transform: scale(1); color: #F5A623; } }

  /* Size tiers: 2-3 contestants get one full-height row (go big); 4-6 share two
     rows (half the vertical space), so text/photo scale down to still fit. */
  #layer-h2h[data-count="2"] .h2h-portrait, #layer-h2h[data-count="3"] .h2h-portrait { max-height: 32vh; }
  #layer-h2h[data-count="2"] .h2h-avatar,   #layer-h2h[data-count="3"] .h2h-avatar   { height: 32vh; font-size: 9vw; }
  #layer-h2h[data-count="2"] .h2h-name,     #layer-h2h[data-count="3"] .h2h-name     { font-size: 3.4vw; }
  #layer-h2h[data-count="2"] .h2h-score,    #layer-h2h[data-count="3"] .h2h-score    { font-size: 8.5vw; }

  #layer-h2h[data-count="4"] .h2h-tile, #layer-h2h[data-count="5"] .h2h-tile, #layer-h2h[data-count="6"] .h2h-tile { padding: 1vh 0.8vw; }
  #layer-h2h[data-count="4"] .h2h-portrait, #layer-h2h[data-count="5"] .h2h-portrait, #layer-h2h[data-count="6"] .h2h-portrait { max-height: 12vh; margin-bottom: 0.8vh; }
  #layer-h2h[data-count="4"] .h2h-avatar,   #layer-h2h[data-count="5"] .h2h-avatar,   #layer-h2h[data-count="6"] .h2h-avatar   { height: 12vh; font-size: 4.2vw; margin-bottom: 0.8vh; }
  #layer-h2h[data-count="4"] .h2h-name,     #layer-h2h[data-count="5"] .h2h-name,     #layer-h2h[data-count="6"] .h2h-name     { font-size: 2.2vw; margin-bottom: 0.6vh; }
  #layer-h2h[data-count="4"] .h2h-score,    #layer-h2h[data-count="5"] .h2h-score,    #layer-h2h[data-count="6"] .h2h-score    { font-size: 4.8vw; }

  /* ── HEAD TO HEAD WINNER TAKEOVER ───────────────────────────── */
  #layer-h2h-winner {
    position: fixed; inset: 0; z-index: 11;
    opacity: 0; pointer-events: none;
    transition: opacity .6s ease;
    background: #050505;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #layer-h2h-winner.winner-active { opacity: 1; }
  #h2h-winner-label {
    font-size: 4.6vw; font-weight: 900; letter-spacing: .2em; text-transform: uppercase;
    color: #F5A623; text-shadow: 0 0 3vw rgba(245,166,35,.6); margin-bottom: 4vh;
  }
  /* Same treatment as VS Card / scoreboard tiles: natural rectangular photo, no
     circular crop, drop-shadow glow instead of a border ring. */
  #h2h-winner-portrait {
    max-width: 52vw; max-height: 48vh; width: auto; height: auto; object-fit: contain;
    border-radius: 8px; margin-bottom: 3vh;
    filter: drop-shadow(0 0 2vw var(--h2h-color, #F5A623));
  }
  #h2h-winner-avatar {
    width: 42vw; height: 42vh; margin-bottom: 3vh; border-radius: 8px;
    background: color-mix(in srgb, var(--h2h-color, #F5A623) 20%, transparent);
    display: flex; align-items: center; justify-content: center;
    font-size: 17vw; font-weight: 900; line-height: 1;
    color: var(--h2h-color, #F5A623);
    text-shadow: 0 0 4vw var(--h2h-color, #F5A623);
  }
  #h2h-winner-name {
    font-size: 7.2vw; font-weight: 900; letter-spacing: .04em; text-transform: uppercase;
    color: #fff; text-align: center; max-width: 88vw;
  }

  /* ── VIZ LAYERS ─────────────────────────────────────────────── */
  #layer-viz-music, #layer-viz-crowd {
    position: fixed;
    inset: 0;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    background: #080808;
  }
  #layer-viz-music canvas, #layer-viz-crowd canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    will-change: transform;
    transform: translateZ(0);
    image-rendering: optimizeSpeed;
  }
</style>
</head>
<body>

<!-- STANDBY LAYER -->
<div id="layer-standby">
  <img id="standby-logo" src="" alt="">
  <div id="standby-text">
    <div id="standby-title"></div>
    <div id="standby-subtitle"></div>
  </div>
</div>

<!-- TITLE CARD LAYER (macro steps) -->
<div id="layer-title">
  <video id="title-video" playsinline autoplay loop muted></video>
  <img id="title-img-a" alt="">
  <img id="title-img-b" alt="">
  <div id="title-name"></div>
</div>

<!-- CHRONO OVERLAY (countdown timer + stopwatch) -->
<div id="layer-timer" style="position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5vh;opacity:0;transition:opacity 0.8s ease">
  <div style="background:rgba(0,0,0,0.72);border-radius:16px;padding:2vw 5vw 1.5vw;text-align:center;backdrop-filter:blur(6px)">
    <div id="timer-num" style="font-size:16vw;font-weight:900;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:0.04em;line-height:0.85;color:#F5A623;text-shadow:0 0 5vw currentColor;transition:color 0.4s"></div>
    <div id="chrono-label" style="font-size:1.8vw;letter-spacing:0.4em;color:rgba(255,255,255,0.5);margin-top:0.5vw;font-weight:600">REMAINING</div>
  </div>
</div>

<!-- LEADERBOARD OVERLAY -->
<div id="layer-leaderboard" style="position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 0.7s ease;background:#060504;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vw 8vw">
  <div id="lb-game-name" style="font-size:3.5vw;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#F5A623;text-shadow:0 0 4vw #F5A62344;text-align:center;margin-bottom:0.6vw"></div>
  <div style="font-size:1.4vw;letter-spacing:0.45em;color:rgba(255,255,255,0.35);margin-bottom:3.5vw;font-weight:600">FASTEST TIMES</div>
  <div id="lb-rows" style="width:100%;max-width:72vw"></div>
</div>

<!-- SLIDE LAYER -->
<div id="layer-slide"></div>

<!-- VS CARD LAYER -->
<div id="layer-vs">
  <div id="vs-divider-line"></div>
  <div class="vs-half vs-half-left" id="vs-left">
    <div id="vs-left-media"></div>
    <div class="vs-namebar">
      <div class="vs-name" id="vs-left-name"></div>
      <div class="vs-sublabel" id="vs-left-sub"></div>
    </div>
  </div>
  <div id="vs-center">
    <div id="vs-text">VS</div>
  </div>
  <div class="vs-half vs-half-right" id="vs-right">
    <div id="vs-right-media"></div>
    <div class="vs-namebar">
      <div class="vs-name" id="vs-right-name"></div>
      <div class="vs-sublabel" id="vs-right-sub"></div>
    </div>
  </div>
</div>

<!-- HEAD TO HEAD SCOREBOARD LAYER -->
<div id="layer-h2h">
  <div id="h2h-title"></div>
  <div class="h2h-grid" id="h2h-grid"></div>
</div>

<!-- HEAD TO HEAD WINNER TAKEOVER -->
<div id="layer-h2h-winner">
  <div id="h2h-winner-label">WINNER!</div>
  <div id="h2h-winner-portrait-wrap"></div>
  <div id="h2h-winner-name"></div>
</div>

<!-- MUSIC REACTIVE VIZ LAYER -->
<div id="layer-viz-music">
  <canvas id="eq-canvas"></canvas>
</div>

<!-- CROWD REACTIVE VIZ LAYER -->
<div id="layer-viz-crowd">
  <canvas id="crowd-canvas"></canvas>
  <!-- Two overlay video elements — we load into the hidden one and swap on first frame to avoid GPU texture flash -->
  <video id="crowd-overlay-video-a" playsinline muted
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           pointer-events:none;opacity:0;background:black;mix-blend-mode:screen"></video>
  <video id="crowd-overlay-video-b" playsinline muted
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           pointer-events:none;opacity:0;background:black;mix-blend-mode:screen"></video>
</div>

<!-- FULL-SCREEN CLIMAX VIDEO — sits above everything -->
<video id="climax-fullscreen-video" playsinline muted
  style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
         pointer-events:none;opacity:0;z-index:20"></video>

<!-- GAME IFRAME OVERLAY — z-index 30, above climax video; kiosk never navigates away from /display -->
<iframe id="game-frame"
  style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:30;display:none;background:#000"
  src="" allowfullscreen allow="autoplay"></iframe>

<!-- WALKUP LAYER -->
<div id="layer-walkup">
  <div id="wu-bg"></div>
  <video id="wu-video" playsinline autoplay loop muted></video>
  <canvas id="wu-frame-hold" style="position:absolute;inset:0;width:100%;height:100%;display:none;z-index:2"></canvas>
  <div id="wu-logo-wrap">
    <img id="wu-logo" src="" alt="">
  </div>
  <div id="wu-namebar">
    <div id="wu-name"></div>
  </div>
</div>

<script>
// ── STANDBY CONFIG ────────────────────────────────────────────────────────────
async function loadStandbyConfig() {
  try {
    const d = await fetch('/api/display/config').then(r => r.json());
    document.getElementById('standby-title').textContent    = d.title    || '';
    document.getElementById('standby-subtitle').textContent = d.subtitle || '';
    document.getElementById('standby-subtitle').style.display = d.subtitle ? '' : 'none';
    const logo = document.getElementById('standby-logo');
    const size = d.logo_size || 50;
    logo.style.maxWidth  = size + 'vw';
    logo.style.maxHeight = Math.round(size * 0.75) + 'vh';
    if (d.logo) {
      logo.src = '/assets/display/' + d.logo + '?t=' + Date.now();
      logo.style.display = 'block';
      logo.onerror = () => { logo.style.display = 'none'; };
    } else {
      logo.style.display = 'none';
    }
  } catch(e) {
    document.getElementById('standby-title').textContent = 'Broken Arrow';
    document.getElementById('standby-subtitle').textContent = 'Adventure Guides';
  }
}
loadStandbyConfig();

// ── STATE ─────────────────────────────────────────────────────────────────────
let standbyActive  = true;
let _displaySeq    = 0; // incremented on every display change to cancel stale onload callbacks
let _titleImgSlot  = 'a'; // which img slot is currently showing
let _startupId     = null; // server startup_id from first connect; changes only on service restart

const layerStandby = document.getElementById('layer-standby');
const layerWalkup  = document.getElementById('layer-walkup');
const layerTitle   = document.getElementById('layer-title');
const layerSlide   = document.getElementById('layer-slide');
const wuBg         = document.getElementById('wu-bg');
const wuVideo      = document.getElementById('wu-video');
// _wuCurrentEl: the video element currently displayed in the walkup layer (starts as wuVideo).
// _wuWarm: url → warm <video> element created fresh per preload (never reused with a different
// src — avoids the Pi 4B synchronous GC freeze that occurs on video.src replacement).
let _wuCurrentEl = wuVideo;
const _wuWarm = {};
const wuLogo       = document.getElementById('wu-logo');
const wuName       = document.getElementById('wu-name');
const wuNamebar    = document.getElementById('wu-namebar');
const wuFrameHold  = document.getElementById('wu-frame-hold');

// ── Show Flow video preloader ──────────────────────────────────────────────
// Keeps a hidden <video> per URL so files are in OS page cache before walkup fires.
const _preloadPool = {};
function preloadAssets(urls) {
  // Start loading any new URLs
  (urls || []).forEach(url => {
    if (_preloadPool[url]) return;
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto';
    v.src = url; v.load();
    _preloadPool[url] = v;
  });
  // Release URLs no longer in the list
  const keep = new Set(urls || []);
  Object.keys(_preloadPool).forEach(url => {
    if (!keep.has(url)) {
      _preloadPool[url].src = '';
      delete _preloadPool[url];
    }
  });
}
fetch('/api/preload_assets').then(r => r.json()).then(d => preloadAssets(d.urls)).catch(() => {});
// ──────────────────────────────────────────────────────────────────────────

// Same deferred-clear pattern as _gameFrame: clearing title-video.src on Pi 4B
// triggers a synchronous GC freeze of ~7s if the element has decoded video in memory.
let _titleVideoClearTimer = null;
function _resetTitleVideo() {
  const v = document.getElementById('title-video');
  v.oncanplay = null; v.pause(); v.style.opacity = '0';
  clearTimeout(_titleVideoClearTimer);
  _titleVideoClearTimer = setTimeout(() => { v.src = ''; _titleVideoClearTimer = null; }, 10000);
}
function _resetTitleImgs() {
  document.getElementById('title-img-a').style.opacity = '0';
  document.getElementById('title-img-b').style.opacity = '0';
  _titleImgSlot = 'a';
}

function showStep(data) {
  const imageUrl = data.image || '';

  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  const seq = ++_displaySeq;

  document.getElementById('title-name').style.display = 'none';
  _resetTitleVideo();

  // Fade walkup out immediately — don't wait for the image to load.
  // Without this, hiding the game iframe (hideGameFrame) reveals the previous walkup
  // video underneath, which stays visible until the step image finishes loading.
  setLayerTransition(0.8);
  layerWalkup.style.opacity       = '0';
  layerWalkup.style.pointerEvents = 'none';
  layerStandby.style.opacity      = '0';
  layerTitle.style.opacity        = '1';

  if (!imageUrl) return;

  // Load into the inactive slot, then crossfade
  const nextSlot = _titleImgSlot === 'a' ? 'b' : 'a';
  const nextImg  = document.getElementById('title-img-' + nextSlot);
  const prevImg  = document.getElementById('title-img-' + _titleImgSlot);

  nextImg.onload = null;
  nextImg.style.opacity = '0';
  nextImg.onload = () => {
    if (_displaySeq !== seq) return;
    nextImg.style.opacity = '1';
    prevImg.style.opacity = '0';
    _titleImgSlot = nextSlot;
  };
  nextImg.onerror = () => { if (_displaySeq === seq) nextImg.style.opacity = '0'; };
  nextImg.src = imageUrl + '?t=' + Date.now();
}

function clearAllLayers() {
  hideSlide();
  hideLeaderboard();
  standbyActive = true;
  const t = 'opacity 1s ease';
  layerWalkup.style.transition = t;
  layerTitle.style.transition  = t;
  layerWalkup.style.opacity  = '0';
  layerTitle.style.opacity   = '0';
  layerWalkup.style.pointerEvents = 'none';
  layerStandby.style.transition = t;
  layerStandby.style.opacity = '1';
  setTimeout(() => {
    wuVideo.pause(); wuVideo.src = '';
    wuLogo.style.display = 'none'; wuLogo.src = '';
    _resetTitleVideo();
    _resetTitleImgs();
  }, 1200);
}

// ── DISPLAY CONTROL ───────────────────────────────────────────────────────────
let _titleAudioCtx = null, _titleGainNode = null, _titleSourceNode = null;
function _ensureTitleAudioGraph(titleVideo) {
  if (_titleAudioCtx) return;
  try {
    _titleAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    _titleSourceNode = _titleAudioCtx.createMediaElementSource(titleVideo);
    _titleGainNode = _titleAudioCtx.createGain();
    _titleSourceNode.connect(_titleGainNode).connect(_titleAudioCtx.destination);
  } catch (e) { /* Web Audio unavailable — falls back to unboosted element volume */ }
}

function showTitleVideo(data) {
  const videoUrl = data.video || '';
  if (!videoUrl) return;
  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  const seq = ++_displaySeq;

  document.getElementById('title-name').style.display = 'none';
  _resetTitleImgs();

  clearTimeout(_titleVideoClearTimer); _titleVideoClearTimer = null; // cancel deferred clear
  const titleVideo = document.getElementById('title-video');
  const holdFrame  = !!data.hold;
  const loopVideo  = data.loop !== undefined ? !!data.loop : !holdFrame;
  const autoRevert = !!data.auto_revert;
  titleVideo.loop    = loopVideo;
  titleVideo.muted   = (data.muted === false) ? false : true;
  titleVideo.onended = holdFrame ? () => { titleVideo.pause(); }
                     : autoRevert ? () => { showStandby(); }
                     : null;

  _ensureTitleAudioGraph(titleVideo);
  if (_titleAudioCtx && _titleAudioCtx.state === 'suspended') _titleAudioCtx.resume().catch(() => {});
  if (_titleGainNode) {
    const g = (typeof data.gain === 'number' && data.gain > 0) ? data.gain : 1.0;
    _titleGainNode.gain.value = g;
  }
  titleVideo.style.opacity = '0';
  const videoUrlBusted = videoUrl + '?t=' + Date.now();
  if (titleVideo.src !== location.origin + videoUrl) {
    titleVideo.src = videoUrlBusted;
    titleVideo.load();
  }
  titleVideo.oncanplay = () => {
    if (_displaySeq !== seq) return;
    titleVideo.oncanplay = null; // canplay can refire during buffering — don't re-issue play()
    titleVideo.play().catch(() => {});
    titleVideo.style.opacity = '1';
    const t = 'opacity 0.8s ease';
    layerWalkup.style.transition    = t;
    layerStandby.style.transition   = t;
    layerTitle.style.transition     = t;
    layerWalkup.style.opacity       = '0';
    layerWalkup.style.pointerEvents = 'none';
    layerStandby.style.opacity      = '0';
    layerTitle.style.opacity        = '1';
  };
}

// Pre-warm the next walkup video in a fresh <video> element so the hardware decoder
// pipeline initialises in the background. Using fresh elements (never reusing one with a
// different src) avoids the Pi 4B synchronous GC freeze that occurs on src replacement.
function _makeWarmElement(url) {
  const v = document.createElement('video');
  v.muted   = true;
  v.preload = 'auto';
  v.loop    = true;
  v.setAttribute('playsinline', '');
  v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none;z-index:1;';
  wuFrameHold.parentNode.insertBefore(v, wuFrameHold);
  v.src = url;
  v.load();
  v.oncanplay = () => { v.oncanplay = null; v.pause(); };
  v.play().catch(() => {});
  return v;
}

function preloadWalkupVideo(data) {
  if (!data) return;
  const itemType  = data.type === 'role' ? 'roles' : data.type === 'game_entry' ? 'game_entries' : 'circles';
  const id        = data.id || '';
  const introFile = data.animation_intro || '';
  const animFile  = data.animation       || '';
  const primaryFile = introFile || animFile;
  if (!id || !primaryFile) return;
  const primaryUrl = `/assets/${itemType}/${id}/${primaryFile}`;

  // Drop stale warm elements from the previous circle
  if (!_wuWarm[primaryUrl]) {
    Object.keys(_wuWarm).forEach(oldUrl => {
      const old = _wuWarm[oldUrl];
      delete _wuWarm[oldUrl];
      old.pause();
      setTimeout(() => { if (old.parentNode) old.parentNode.removeChild(old); }, 500);
    });
  }

  // Warm the primary file (intro or animation-only)
  if (!_wuWarm[primaryUrl]) _wuWarm[primaryUrl] = _makeWarmElement(primaryUrl);

  // When both intro and loop exist, also warm the loop so _startMainAnim can swap it in instantly
  if (introFile && animFile) {
    const animUrl = `/assets/${itemType}/${id}/${animFile}`;
    if (!_wuWarm[animUrl]) _wuWarm[animUrl] = _makeWarmElement(animUrl);
  }
}

function showWalkup(data) {
  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  _displaySeq++; // cancel any pending showStep image load
  _resetTitleVideo();

  const color     = data.color     || '#F5A623';
  const name      = (data.name    || '').toUpperCase();
  const introFile = data.animation_intro || '';
  const animFile  = data.animation       || '';
  const logoFile  = data.logo            || '';
  const logoUrl   = data.logo_url  || '';
  const id        = data.id        || '';
  const itemType  = data.type === 'role' ? 'roles' : data.type === 'game_entry' ? 'game_entries' : 'circles';

  // If a warm element is ready for this URL, swap it in — instant play.
  // readyState >= 2 (HAVE_CURRENT_DATA) = first frame decoded, hardware pipeline running.
  const primaryFile = introFile || animFile;
  const primaryBase = primaryFile ? `/assets/${itemType}/${id}/${primaryFile}` : '';
  const warmEl = primaryBase ? _wuWarm[primaryBase] : null;
  if (warmEl && warmEl.readyState >= 2) {
    warmEl.loop  = false;
    warmEl.muted = (data.muted === false) ? false : true;
    warmEl.style.display = 'none';  // showWalkup will re-show it below via alreadyReady path
    const oldEl = _wuCurrentEl;
    _wuCurrentEl = warmEl;
    delete _wuWarm[primaryBase];
    // Retire old element: hide immediately (so old content vanishes), remove from DOM later.
    // No src='' — removing the DOM reference lets GC run async without a main-thread freeze.
    oldEl.pause();
    oldEl.style.display = 'none';
    if (oldEl !== wuVideo) {
      setTimeout(() => { if (oldEl.parentNode) oldEl.parentNode.removeChild(oldEl); }, 5000);
    }
  }
  const vid = _wuCurrentEl;
  vid.muted = (data.muted === false) ? false : true;

  // Background wash
  wuBg.style.background = `radial-gradient(ellipse at 50% 30%, ${hexOpacity(color, 0.18)} 0%, #050505 70%)`;

  // Name
  wuName.textContent = name;
  wuName.style.color = color;
  wuNamebar.style.display = (data.hide_name && (introFile || animFile)) ? 'none' : '';

  // Reset active element callbacks; don't clear src (Pi GC freeze — see preloadWalkupVideo comment)
  vid.oncanplay = null;
  vid.onerror   = null;
  vid.onended   = null;
  vid.style.display = 'none';
  vid.pause();
  wuLogo.onload  = null;
  wuLogo.onerror = null;
  wuLogo.style.display = 'none';
  wuLogo.src = '';

  function _showLogo() {
    if (logoUrl) {
      wuLogo.onerror = () => { wuLogo.style.display = 'none'; tryLogo(itemType, id, logoFile); };
      wuLogo.onload  = () => { wuLogo.style.display = 'block'; };
      wuLogo.src     = logoUrl + '?t=' + Date.now();
    } else {
      tryLogo(itemType, id, logoFile);
    }
  }

  function _startMainAnim() {
    vid.oncanplay = null;
    vid.onerror   = null;
    if (!animFile) {
      if (!introFile) _showLogo();
      return;
    }
    // Snapshot last intro frame to canvas so there's no black flash during transition
    if (introFile && vid.videoWidth) {
      wuFrameHold.width  = vid.offsetWidth  || window.innerWidth;
      wuFrameHold.height = vid.offsetHeight || window.innerHeight;
      wuFrameHold.getContext('2d').drawImage(vid, 0, 0, wuFrameHold.width, wuFrameHold.height);
      wuFrameHold.style.display = 'block';
    }
    const animBase = `/assets/${itemType}/${id}/${animFile}`;

    // If a warm element for the loop animation is ready, swap it in — no cold src change on Pi.
    const warmAnim = _wuWarm[animBase];
    if (warmAnim && warmAnim.readyState >= 2) {
      delete _wuWarm[animBase];
      warmAnim.loop  = true;
      warmAnim.muted = (data.muted === false) ? false : true;
      warmAnim.style.display = 'block';
      const oldEl = _wuCurrentEl;
      _wuCurrentEl = warmAnim;
      oldEl.pause();
      oldEl.style.display = 'none';
      if (oldEl !== wuVideo) setTimeout(() => { if (oldEl.parentNode) oldEl.parentNode.removeChild(oldEl); }, 5000);
      warmAnim.play().then(() => {
        wuFrameHold.style.display = 'none';
      }).catch(() => { wuFrameHold.style.display = 'none'; warmAnim.style.display = 'none'; _showLogo(); });
      return;
    }

    // Cold path — warm element wasn't ready in time; fall back to src swap on current element
    const animUrl  = _preloadPool[animBase] ? animBase : animBase + '?t=' + Date.now();
    vid.loop = true;
    vid.onerror   = () => { wuFrameHold.style.display = 'none'; vid.style.display = 'none'; _showLogo(); };
    vid.oncanplay = () => {
      vid.style.display = 'block';
      vid.play().then(() => {
        wuFrameHold.style.display = 'none';
      }).catch(() => { wuFrameHold.style.display = 'none'; vid.style.display = 'none'; _showLogo(); });
    };
    vid.src = animUrl;
    vid.load();
  }

  if (introFile) {
    // If this was a preload-swap, vid.src already matches — check readyState to play immediately
    const introBase = `/assets/${itemType}/${id}/${introFile}`;
    const alreadyReady = (vid.src === location.origin + introBase || vid.src === introBase) && vid.readyState >= 2;
    vid.loop    = false;
    vid.onerror = () => { vid.style.display = 'none'; _startMainAnim(); };
    // reveal_game_url: this walkup is a game's intro (e.g. the Wheel, preloaded
    // hidden behind it) — reveal it the instant this video actually finishes,
    // not on a blind timer guessing when that'll be.
    vid.onended = () => { vid.onended = null; _startMainAnim(); if (data.reveal_game_url) revealGameFrame(); };
    if (alreadyReady) {
      try { vid.currentTime = 0; } catch(e) {}
      vid.style.display = 'block';
      vid.play().catch(() => { vid.style.display = 'none'; _startMainAnim(); });
    } else {
      vid.oncanplay = () => {
        vid.style.display = 'block';
        vid.play().catch(() => { vid.style.display = 'none'; _startMainAnim(); });
      };
      const introUrl = _preloadPool[introBase] ? introBase : introBase + '?t=' + Date.now();
      vid.src = introUrl;
      vid.load();
    }
  } else if (animFile) {
    const animBase = `/assets/${itemType}/${id}/${animFile}`;
    const alreadyReady = (vid.src === location.origin + animBase || vid.src === animBase) && vid.readyState >= 3;
    if (alreadyReady) {
      vid.loop = true;
      vid.style.display = 'block';
      vid.play().catch(() => { vid.style.display = 'none'; _showLogo(); });
    } else {
      _startMainAnim();
    }
  } else {
    _showLogo();
  }

  // Kick off preload for the next step's walkup while this one plays.
  // The server includes next_preload in the display_walkup payload when called from show flow.
  if (data.next_preload) preloadWalkupVideo(data.next_preload);

  // Fade IN — stays until next step or explicit clear
  setLayerTransition(0.8);
  layerStandby.style.opacity = '0';
  layerTitle.style.opacity   = '0';
  layerWalkup.style.opacity  = '1';
  layerWalkup.style.pointerEvents = 'auto';
}

function tryLogo(itemType, id, logoFile) {
  const src = logoFile
    ? `/assets/${itemType}/${id}/${logoFile}?t=${Date.now()}`
    : `/assets/${itemType}/${id}/logo.png?t=${Date.now()}`;
  wuLogo.onerror = () => { wuLogo.style.display = 'none'; };
  wuLogo.onload  = () => { wuLogo.style.display = 'block'; };
  wuLogo.src = src;
}

function showStandby(fadeDurMs) {
  hideLeaderboard();
  hideSlide();
  standbyActive = true;
  _displaySeq++; // cancel any pending showStep image load

  const dur = fadeDurMs || 1200;
  const t = `opacity ${dur / 1000}s ease`;
  layerStandby.style.transition = t;
  layerWalkup.style.transition  = t;
  layerTitle.style.transition   = t;

  layerWalkup.style.opacity  = '0';
  layerWalkup.style.pointerEvents = 'none';
  layerTitle.style.opacity   = '0';
  layerStandby.style.opacity = '1';

  setTimeout(() => {
    // If a warm element was swapped in as active, retire it (no src='' = no GC freeze now)
    if (_wuCurrentEl !== wuVideo) {
      _wuCurrentEl.pause();
      const el = _wuCurrentEl;
      _wuCurrentEl = wuVideo;
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 100);
    }
    // Drop any pending warm preloads
    Object.keys(_wuWarm).forEach(url => {
      const v = _wuWarm[url]; delete _wuWarm[url];
      v.pause(); setTimeout(() => { if (v.parentNode) v.parentNode.removeChild(v); }, 100);
    });
    wuVideo.pause();
    wuVideo.src = '';
    wuLogo.style.display = 'none';
    wuLogo.src = '';
    _resetTitleVideo();
  }, dur + 200);
}

function setLayerTransition(seconds) {
  const t = `opacity ${seconds}s ease`;
  layerStandby.style.transition = t;
  layerWalkup.style.transition  = t;
  layerTitle.style.transition   = t;
}

// ── SLIDE ─────────────────────────────────────────────────────────────────────
const _SLIDE_ACCENTS = {amber:'#F5A623', blue:'#4A9FD4', green:'#3CB96A', white:'#FFFFFF', red:'#E83A3A'};

function showSlide(data) {
  if (!data || !data.template) return;
  _displaySeq++;        // cancel any pending showStep/showTitleVideo load callbacks
  _resetTitleVideo();   // stop any title video still playing under us
  const acc = (data.theme && data.theme.startsWith('#')) ? data.theme : (_SLIDE_ACCENTS[data.theme] || _SLIDE_ACCENTS.amber);
  layerSlide.style.setProperty('--sl-a', acc);
  const [r,g,b] = [parseInt(acc.slice(1,3),16), parseInt(acc.slice(3,5),16), parseInt(acc.slice(5,7),16)];
  layerSlide.style.background = `radial-gradient(ellipse at 50% 40%, rgba(${r},${g},${b},.07) 0%, #060504 65%)`;

  const H = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let html = '';
  if (data.template === 'big_title') {
    html = `<div class="sl-big"><div class="sl-head">${H(data.headline)}</div>${data.subtitle?`<div class="sl-sub">${H(data.subtitle)}</div>`:''}</div>`;
  } else if (data.template === 'bulletin') {
    const lines = (data.lines||'').split('\n').filter(l=>l.trim()).map(l=>`<div class="sl-line">${H(l)}</div>`).join('');
    html = `<div class="sl-bul"><div class="sl-head">${H(data.headline)}</div><div class="sl-rule"></div>${lines}</div>`;
  } else if (data.template === 'next_event') {
    html = `<div class="sl-nxt"><div class="sl-label">${H(data.label||'NEXT CAMP')}</div><div class="sl-rule"></div><div class="sl-name">${H(data.event_name)}</div>${data.date_text?`<div class="sl-date">${H(data.date_text)}</div>`:''}</div>`;
  } else if (data.template === 'spotlight') {
    const img = data.image ? `<img class="sl-img" src="/assets/${H(data.image)}" alt="">` : '';
    html = `<div class="sl-spot">${img}<div class="sl-txt"><div class="sl-head">${H(data.headline)}</div>${data.subtitle?`<div class="sl-sub">${H(data.subtitle)}</div>`:''}</div></div>`;
  } else if (data.template === 'qr') {
    const qimg = data.qr_data_url ? `<img class="sl-qimg" src="${data.qr_data_url}" alt="QR">` : '';
    html = `<div class="sl-qr"><div class="sl-head">${H(data.headline)}</div>${data.body?`<div class="sl-body">${H(data.body)}</div>`:''}<div class="sl-rule" style="width:20vw;margin:1.2vw auto"></div>${qimg}${data.qr_url?`<div class="sl-url">${H(data.qr_url)}</div>`:''}</div>`;
  }
  layerSlide.innerHTML = html;

  const t = 'opacity .7s ease';
  [layerWalkup, layerTitle, layerStandby, layerSlide].forEach(l => l.style.transition = t);
  layerWalkup.style.opacity  = '0'; layerWalkup.style.pointerEvents  = 'none';
  layerTitle.style.opacity   = '0';
  layerStandby.style.opacity = '0';
  layerSlide.style.opacity   = '1'; layerSlide.style.pointerEvents   = 'auto';
  hideLeaderboard();
  standbyActive = false;
}

function hideSlide() {
  layerSlide.style.transition   = 'opacity .7s ease';
  layerSlide.style.opacity      = '0';
  layerSlide.style.pointerEvents = 'none';
}

// ── GAME FRAME (iframe overlay — kiosk never leaves /display) ──
// Clearing _gameFrame.src triggers a Chromium JS GC that blocks the main thread
// for several seconds on Pi 4B — enough to delay walkup video by 7s. We defer
// the src clear by 10s so GC happens when the browser is idle, not mid-walkup.
const _gameFrame = document.getElementById('game-frame');
let _gameFrameClearTimer = null;
// True while a game is preloading hidden behind an intro walkup (see
// preloadGameFrame below). The walkup's own display_walkup broadcast would
// otherwise hit hideGameFrame() and both hide AND, 10s later, clear the src
// of the game we're actively preloading — wiping it out before the reveal
// ever gets a chance to show it.
let _gamePreloading = false;
function showGameFrame(url) {
  clearTimeout(_gameFrameClearTimer);
  _gamePreloading = false;
  const sep = url.includes('?') ? '&' : '?';
  _gameFrame.src = url + sep + '_v=' + Date.now();
  _gameFrame.style.display = 'block';
  _gameFrame.style.visibility = 'visible';
}
function hideGameFrame() {
  _gamePreloading = false;
  if (_gameFrame.style.display === 'none') return;
  // The iframe's document stays alive for the next 10s (src isn't cleared —
  // see the GC-stall comment above), so anything with an in-flight timeline
  // (Shell Game's reveal, a Musical Chairs round) needs to know it's been
  // backgrounded or it'll finish that timeline unseen and still fire its
  // audio/SFX — e.g. a stray reveal cheer a few seconds after the operator
  // already navigated away.
  try { _gameFrame.contentWindow.postMessage({ type: 'mm_game_hidden' }, '*'); } catch(e) {}
  _gameFrame.style.display = 'none';
  _gameFrame.style.visibility = 'visible';
  clearTimeout(_gameFrameClearTimer);
  _gameFrameClearTimer = setTimeout(() => { _gameFrame.src = ''; }, 10000);
}
// Loads a game's iframe kept hidden — used when a game entry's intro walkup
// is covering the screen, so the game (e.g. the Wheel, already idly
// spinning on load) has the whole walkup duration to load before
// revealGameFrame() cuts over to it, instead of a cold first frame.
// Uses visibility:hidden, NOT display:none — a display:none iframe has a
// zero-size layout box (canvas sizing inside it reads 0) and browsers pause
// its rAF loop, so nothing lays out correctly and the "already spinning"
// goal silently fails. visibility:hidden keeps real layout + rendering
// running while staying invisible on screen.
function preloadGameFrame(url) {
  clearTimeout(_gameFrameClearTimer);
  _gamePreloading = true;
  const sep = url.includes('?') ? '&' : '?';
  _gameFrame.style.display = 'block';
  _gameFrame.style.visibility = 'hidden';
  _gameFrame.src = url + sep + '_v=' + Date.now();
}
function revealGameFrame() {
  clearTimeout(_gameFrameClearTimer);
  _gamePreloading = false;
  _gameFrame.style.display = 'block';
  _gameFrame.style.visibility = 'visible';
}

function blackout() {
  hideChronoOverlay();
  hideLeaderboard();
  hideSlide();
  standbyActive = false;
  _displaySeq++;
  const t = 'opacity 1s ease';
  layerStandby.style.transition = t;
  layerWalkup.style.transition  = t;
  layerTitle.style.transition   = t;
  layerStandby.style.opacity = '0';
  layerWalkup.style.opacity  = '0';
  layerTitle.style.opacity   = '0';
  layerWalkup.style.pointerEvents = 'none';
  setTimeout(() => {
    wuVideo.pause(); wuVideo.src = '';
    wuLogo.style.display = 'none'; wuLogo.src = '';
    _resetTitleVideo();
    _resetTitleImgs();
  }, 1200);
}

const layerVs = document.getElementById('layer-vs');

function hideVsCard() {
  layerVs.classList.remove('vs-active');
  layerVs.style.pointerEvents = 'none';
}

function showVsCard(data) {
  hideSlide();
  hideLeaderboard();

  const theme   = data.theme  || 'fire_ice';
  const leftCfg = data.left   || {};
  const rightCfg= data.right  || {};

  // Theme class
  layerVs.className = 'theme-' + theme;

  function _fitVsName(nameEl) {
    const namebarEl = nameEl.parentElement;
    nameEl.style.fontSize = '';
    const maxWidth   = nameEl.clientWidth;
    const availBelow = window.innerHeight - namebarEl.getBoundingClientRect().top - (window.innerHeight * 0.02);
    let size = parseFloat(getComputedStyle(nameEl).fontSize);
    let guard = 0;
    while ((nameEl.scrollWidth > maxWidth || namebarEl.scrollHeight > availBelow) && guard < 40) {
      size -= size * 0.06;
      nameEl.style.fontSize = size + 'px';
      guard++;
    }
  }

  function _applyHalf(halfEl, mediaEl, nameEl, subEl, cfg, side) {
    halfEl.style.setProperty('--vs-color', cfg.color || (side === 'left' ? '#E83A3A' : '#4A9FD4'));
    halfEl.style.setProperty('--img-scale', cfg.image_scale || 1.0);
    nameEl.textContent = (cfg.name || cfg.label || '').toUpperCase();
    subEl.textContent  = cfg.sub || cfg.sublabel || '';
    subEl.style.display = (cfg.sub || cfg.sublabel) ? '' : 'none';
    _fitVsName(nameEl);

    mediaEl.innerHTML = '';
    if (cfg.image_url) {
      const img = document.createElement('img');
      img.className = 'vs-portrait';
      img.src = cfg.image_url + '?t=' + Date.now();
      img.onerror = () => { _fallbackAvatar(mediaEl, cfg, side); };
      mediaEl.appendChild(img);
    } else {
      _fallbackAvatar(mediaEl, cfg, side);
    }
  }

  function _fallbackAvatar(mediaEl, cfg, side) {
    mediaEl.innerHTML = '';
    const av = document.createElement('div');
    av.className = 'vs-letter-avatar';
    av.style.setProperty('--vs-color', cfg.color || (side === 'left' ? '#E83A3A' : '#4A9FD4'));
    av.textContent = (cfg.name || cfg.label || (side === 'left' ? 'L' : 'R')).charAt(0).toUpperCase();
    mediaEl.appendChild(av);
  }

  _applyHalf(
    document.getElementById('vs-left'),
    document.getElementById('vs-left-media'),
    document.getElementById('vs-left-name'),
    document.getElementById('vs-left-sub'),
    leftCfg, 'left'
  );
  _applyHalf(
    document.getElementById('vs-right'),
    document.getElementById('vs-right-media'),
    document.getElementById('vs-right-name'),
    document.getElementById('vs-right-sub'),
    rightCfg, 'right'
  );

  // Flash in
  layerVs.style.opacity       = '';
  layerVs.style.pointerEvents = 'auto';
  requestAnimationFrame(() => {
    layerVs.classList.add('vs-active');
  });
}

function updateH2HScore(data) {

  const scoreEl = tile.querySelector('.h2h-score');

  else if (data.direction < 0) scoreEl.classList.add('pulse-down');

function updateH2HReset(data) {

    const tile = document.querySelector(`#h2h-grid .h2h-tile[data-contestant-id="${cid}"]`);
    if (tile) tile.querySelector('.h2h-score').textContent = scores[cid];
