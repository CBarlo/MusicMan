<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Man Display</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:#080808;
    font-family:'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    overflow:hidden;
    color:#fff;
  }

  /* ── LAYERS ────────────────────────────────────────────── */
  #layer-standby,
  #layer-walkup {
    position:fixed;
    inset:0;
  }
  #layer-standby { opacity:1; z-index:1; }
  #layer-walkup  { opacity:0; z-index:2; pointer-events:none; }

  /* ── STANDBY ────────────────────────────────────────────── */
  #layer-standby {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3vh;
    background:#080808;
  }
  #standby-logo {
    max-width:28vw;
    max-height:38vh;
    object-fit:contain;
    display:none;
  }
  #standby-text {
    text-align:center;
    opacity:0.18;
  }
  #standby-title {
    font-size:7vw;
    font-weight:800;
    letter-spacing:0.15em;
    text-transform:uppercase;
    line-height:1;
  }
  #standby-subtitle {
    font-size:2.2vw;
    letter-spacing:0.45em;
    text-transform:uppercase;
    margin-top:1vw;
    font-weight:500;
  }

  /* ── WALKUP ────────────────────────────────────────────── */
  #layer-walkup {
    display:flex;
    flex-direction:column;
  }

  /* Background color wash */
  #wu-bg {
    position:absolute;
    inset:0;
    background:#000;
  }

  /* Full-screen video */
  #wu-video {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:1;
  }

  /* Logo centered */
  #wu-logo-wrap {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  #wu-logo {
    max-width:55vw;
    max-height:70vh;
    object-fit:contain;
    display:none;
    filter:drop-shadow(0 0 4vw rgba(0,0,0,0.5));
  }

  /* Name bar */
  #wu-namebar {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:3vh 5vw 4vh;
    background:linear-gradient(transparent, rgba(0,0,0,0.85) 60%);
    text-align:center;
  }
  #wu-name {
    font-size:8vw;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:0.9;
    text-shadow:0 4px 3vw rgba(0,0,0,0.6);
  }

  /* ── TITLE CARD (macro steps) ──────────────────────────── */
  #layer-title {
    position:fixed;
    inset:0;
    z-index:3;
    opacity:0;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
  }
  #title-name {
    font-size:12vw;
    font-weight:900;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
    line-height:1;
    padding:0 6vw;
    text-shadow:0 0 8vw currentColor;
    position:relative;
    z-index:2;
  }
  #title-video,
  #title-img-a,
  #title-img-b {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.8s ease;
  }

  /* ── BREATHE ANIMATION on standby ──────────────────────── */
  @keyframes breathe {
    0%, 100% { opacity:0.85; }
    50%       { opacity:1; }
  }
  #standby-logo, #standby-text { animation:breathe 4s ease-in-out infinite; }

  /* ── SLIDE LAYER ─────────────────────────────────────────── */
  #layer-slide {
    position:fixed; inset:0; z-index:4;
    opacity:0; pointer-events:none;
    transition:opacity .7s ease;
    display:flex; align-items:center; justify-content:center;
    background:#060504; overflow:hidden;
  }
  /* BIG TITLE */
  .sl-big          { text-align:center; padding:0 8vw; }
  .sl-big .sl-head { font-size:15vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; line-height:.9; color:var(--sl-a,#F5A623); text-shadow:0 0 8vw currentColor; }
  .sl-big .sl-sub  { font-size:4vw; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.82); margin-top:2vw; }
  /* BULLETIN */
  .sl-bul          { padding:0 10vw; width:100%; }
  .sl-bul .sl-head { font-size:7vw; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 5vw currentColor; line-height:1; }
  .sl-rule         { width:100%; height:3px; background:var(--sl-a,#F5A623); margin:1.5vw 0; opacity:.7; }
  .sl-line         { font-size:3.8vw; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:rgba(255,255,255,.9); line-height:1.6; padding-left:1.5vw; border-left:.5vw solid var(--sl-a,#F5A623); margin:.5vw 0; }
  /* NEXT EVENT */
  .sl-nxt            { text-align:center; padding:0 8vw; }
  .sl-nxt .sl-label  { font-size:2.4vw; font-weight:700; letter-spacing:.5em; text-transform:uppercase; color:rgba(255,255,255,.45); margin-bottom:1.5vw; }
  .sl-nxt .sl-name   { font-size:11vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 7vw currentColor; line-height:.88; margin:1.5vw 0; }
  .sl-nxt .sl-date   { font-size:4.2vw; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.8); margin-top:1.5vw; }
  /* SPOTLIGHT */
  .sl-spot           { display:flex; align-items:center; gap:6vw; padding:0 7vw; width:100%; }
  .sl-spot .sl-img   { max-width:36vw; max-height:72vh; object-fit:contain; filter:drop-shadow(0 0 5vw rgba(0,0,0,.55)); flex-shrink:0; }
  .sl-spot .sl-txt   { flex:1; }
  .sl-spot .sl-head  { font-size:8vw; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 5vw currentColor; line-height:.88; }
  .sl-spot .sl-sub   { font-size:3.4vw; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.75); margin-top:2vw; }
  /* QR CODE */
  .sl-qr             { text-align:center; padding:0 8vw; }
  .sl-qr .sl-head    { font-size:6vw; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--sl-a,#F5A623); text-shadow:0 0 4vw currentColor; line-height:1; }
  .sl-qr .sl-body    { font-size:2.6vw; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.65); margin:1.2vw 0; }
  .sl-qr .sl-qimg    { width:24vw; height:24vw; margin:1.2vw auto; display:block; border:1vw solid #fff; border-radius:.6vw; image-rendering:pixelated; }
  .sl-qr .sl-url     { font-size:1.7vw; font-weight:600; letter-spacing:.08em; color:rgba(255,255,255,.38); font-family:'Share Tech Mono','Courier New',monospace; margin-top:.4vw; }

  /* ── VIZ LAYERS ─────────────────────────────────────────────── */
  #layer-viz-music, #layer-viz-crowd {
    position: fixed;
    inset: 0;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    background: #080808;
  }
  #layer-viz-music canvas, #layer-viz-crowd canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<!-- STANDBY LAYER -->
<div id="layer-standby">
  <img id="standby-logo" src="" alt="">
  <div id="standby-text">
    <div id="standby-title"></div>
    <div id="standby-subtitle"></div>
  </div>
</div>

<!-- TITLE CARD LAYER (macro steps) -->
<div id="layer-title">
  <video id="title-video" playsinline autoplay loop muted></video>
  <img id="title-img-a" alt="">
  <img id="title-img-b" alt="">
  <div id="title-name"></div>
</div>

<!-- CHRONO OVERLAY (countdown timer + stopwatch) -->
<div id="layer-timer" style="position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5vh;opacity:0;transition:opacity 0.8s ease">
  <div style="background:rgba(0,0,0,0.72);border-radius:16px;padding:2vw 5vw 1.5vw;text-align:center;backdrop-filter:blur(6px)">
    <div id="timer-num" style="font-size:16vw;font-weight:900;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:0.04em;line-height:0.85;color:#F5A623;text-shadow:0 0 5vw currentColor;transition:color 0.4s"></div>
    <div id="chrono-label" style="font-size:1.8vw;letter-spacing:0.4em;color:rgba(255,255,255,0.5);margin-top:0.5vw;font-weight:600">REMAINING</div>
  </div>
</div>

<!-- LEADERBOARD OVERLAY -->
<div id="layer-leaderboard" style="position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 0.7s ease;background:#060504;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vw 8vw">
  <div id="lb-game-name" style="font-size:3.5vw;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#F5A623;text-shadow:0 0 4vw #F5A62344;text-align:center;margin-bottom:0.6vw"></div>
  <div style="font-size:1.4vw;letter-spacing:0.45em;color:rgba(255,255,255,0.35);margin-bottom:3.5vw;font-weight:600">FASTEST TIMES</div>
  <div id="lb-rows" style="width:100%;max-width:72vw"></div>
</div>

<!-- SLIDE LAYER -->
<div id="layer-slide"></div>

<!-- MUSIC REACTIVE VIZ LAYER -->
<div id="layer-viz-music">
  <canvas id="eq-canvas"></canvas>
</div>

<!-- CROWD REACTIVE VIZ LAYER -->
<div id="layer-viz-crowd">
  <canvas id="crowd-canvas"></canvas>
  <!-- Two overlay video elements — we load into the hidden one and swap on first frame to avoid GPU texture flash -->
  <video id="crowd-overlay-video-a" playsinline muted
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           pointer-events:none;opacity:0;background:black;mix-blend-mode:screen"></video>
  <video id="crowd-overlay-video-b" playsinline muted
    style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
           pointer-events:none;opacity:0;background:black;mix-blend-mode:screen"></video>
</div>

<!-- FULL-SCREEN CLIMAX VIDEO — sits above everything -->
<video id="climax-fullscreen-video" playsinline muted
  style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
         pointer-events:none;opacity:0;z-index:20"></video>

<!-- WALKUP LAYER -->
<div id="layer-walkup">
  <div id="wu-bg"></div>
  <video id="wu-video" playsinline autoplay loop muted></video>
  <canvas id="wu-frame-hold" style="position:absolute;inset:0;width:100%;height:100%;display:none;z-index:2"></canvas>
  <div id="wu-logo-wrap">
    <img id="wu-logo" src="" alt="">
  </div>
  <div id="wu-namebar">
    <div id="wu-name"></div>
  </div>
</div>

<script>
// ── STANDBY CONFIG ────────────────────────────────────────────────────────────
async function loadStandbyConfig() {
  try {
    const d = await fetch('/api/display/config').then(r => r.json());
    document.getElementById('standby-title').textContent    = d.title    || '';
    document.getElementById('standby-subtitle').textContent = d.subtitle || '';
    document.getElementById('standby-subtitle').style.display = d.subtitle ? '' : 'none';
    const logo = document.getElementById('standby-logo');
    const size = d.logo_size || 50;
    logo.style.maxWidth  = size + 'vw';
    logo.style.maxHeight = Math.round(size * 0.75) + 'vh';
    if (d.logo) {
      logo.src = '/assets/display/' + d.logo + '?t=' + Date.now();
      logo.style.display = 'block';
      logo.onerror = () => { logo.style.display = 'none'; };
    } else {
      logo.style.display = 'none';
    }
  } catch(e) {
    document.getElementById('standby-title').textContent = 'Broken Arrow';
    document.getElementById('standby-subtitle').textContent = 'Adventure Guides';
  }
}
loadStandbyConfig();

// ── STATE ─────────────────────────────────────────────────────────────────────
let standbyActive  = true;
let _displaySeq    = 0; // incremented on every display change to cancel stale onload callbacks
let _titleImgSlot  = 'a'; // which img slot is currently showing
let _startupId     = null; // server startup_id from first connect; changes only on service restart

const layerStandby = document.getElementById('layer-standby');
const layerWalkup  = document.getElementById('layer-walkup');
const layerTitle   = document.getElementById('layer-title');
const layerSlide   = document.getElementById('layer-slide');
const wuBg         = document.getElementById('wu-bg');
const wuVideo      = document.getElementById('wu-video');
const wuLogo       = document.getElementById('wu-logo');
const wuName       = document.getElementById('wu-name');
const wuNamebar    = document.getElementById('wu-namebar');
const wuFrameHold  = document.getElementById('wu-frame-hold');

function _resetTitleVideo() {
  const v = document.getElementById('title-video');
  v.oncanplay = null; v.pause(); v.src = ''; v.style.opacity = '0';
}
function _resetTitleImgs() {
  document.getElementById('title-img-a').style.opacity = '0';
  document.getElementById('title-img-b').style.opacity = '0';
  _titleImgSlot = 'a';
}

function showStep(data) {
  const imageUrl = data.image || '';
  if (!imageUrl) return;

  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  const seq = ++_displaySeq;

  document.getElementById('title-name').style.display = 'none';
  _resetTitleVideo();

  // Load into the inactive slot, then crossfade
  const nextSlot = _titleImgSlot === 'a' ? 'b' : 'a';
  const nextImg  = document.getElementById('title-img-' + nextSlot);
  const prevImg  = document.getElementById('title-img-' + _titleImgSlot);

  nextImg.onload = null;
  nextImg.style.opacity = '0';
  nextImg.onload = () => {
    if (_displaySeq !== seq) return;
    nextImg.style.opacity = '1';
    prevImg.style.opacity = '0';
    _titleImgSlot = nextSlot;
    const t = 'opacity 0.8s ease';
    layerWalkup.style.transition    = t;
    layerStandby.style.transition   = t;
    layerTitle.style.transition     = t;
    layerWalkup.style.opacity       = '0';
    layerWalkup.style.pointerEvents = 'none';
    layerStandby.style.opacity      = '0';
    layerTitle.style.opacity        = '1';
  };
  nextImg.onerror = () => { if (_displaySeq === seq) nextImg.style.opacity = '0'; };
  nextImg.src = imageUrl + '?t=' + Date.now();
}

function clearAllLayers() {
  hideSlide();
  hideLeaderboard();
  standbyActive = true;
  const t = 'opacity 1s ease';
  layerWalkup.style.transition = t;
  layerTitle.style.transition  = t;
  layerWalkup.style.opacity  = '0';
  layerTitle.style.opacity   = '0';
  layerWalkup.style.pointerEvents = 'none';
  layerStandby.style.transition = t;
  layerStandby.style.opacity = '1';
  setTimeout(() => {
    wuVideo.pause(); wuVideo.src = '';
    wuLogo.style.display = 'none'; wuLogo.src = '';
    _resetTitleVideo();
    _resetTitleImgs();
  }, 1200);
}

// ── DISPLAY CONTROL ───────────────────────────────────────────────────────────
function showTitleVideo(data) {
  const videoUrl = data.video || '';
  if (!videoUrl) return;
  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  const seq = ++_displaySeq;

  document.getElementById('title-name').style.display = 'none';
  _resetTitleImgs();

  const titleVideo = document.getElementById('title-video');
  const holdFrame  = !!data.hold;
  const loopVideo  = data.loop !== undefined ? !!data.loop : !holdFrame;
  titleVideo.loop    = loopVideo;
  titleVideo.onended = holdFrame ? () => { titleVideo.pause(); } : null;
  titleVideo.style.opacity = '0';
  if (titleVideo.src !== location.origin + videoUrl) {
    titleVideo.src = videoUrl;
    titleVideo.load();
  }
  titleVideo.oncanplay = () => {
    if (_displaySeq !== seq) return;
    titleVideo.play().catch(() => {});
    titleVideo.style.opacity = '1';
    const t = 'opacity 0.8s ease';
    layerWalkup.style.transition    = t;
    layerStandby.style.transition   = t;
    layerTitle.style.transition     = t;
    layerWalkup.style.opacity       = '0';
    layerWalkup.style.pointerEvents = 'none';
    layerStandby.style.opacity      = '0';
    layerTitle.style.opacity        = '1';
  };
}

function showWalkup(data) {
  hideSlide();
  hideLeaderboard();
  standbyActive = false;
  _displaySeq++; // cancel any pending showStep image load
  _resetTitleVideo();

  const color    = data.color     || '#F5A623';
  const name     = (data.name    || '').toUpperCase();
  const introFile = data.animation_intro || '';
  const animFile  = data.animation       || '';
  const logoFile  = data.logo            || '';
  const logoUrl  = data.logo_url  || '';
  const id       = data.id        || '';
  const itemType = data.type === 'role' ? 'roles' : 'circles';

  // Background wash
  wuBg.style.background = `radial-gradient(ellipse at 50% 30%, ${hexOpacity(color, 0.18)} 0%, #050505 70%)`;

  // Name
  wuName.textContent = name;
  wuName.style.color = color;
  wuNamebar.style.display = (data.hide_name && (introFile || animFile)) ? 'none' : '';

  // Reset media — null callbacks before clearing src to prevent stale closures firing
  wuVideo.oncanplay = null;
  wuVideo.onerror   = null;
  wuVideo.onended   = null;
  wuVideo.style.display = 'none';
  wuVideo.pause();
  wuVideo.src = '';
  wuLogo.onload  = null;
  wuLogo.onerror = null;
  wuLogo.style.display = 'none';
  wuLogo.src = '';

  function _showLogo() {
    if (logoUrl) {
      wuLogo.onerror = () => { wuLogo.style.display = 'none'; tryLogo(itemType, id, logoFile); };
      wuLogo.onload  = () => { wuLogo.style.display = 'block'; };
      wuLogo.src     = logoUrl + '?t=' + Date.now();
    } else {
      tryLogo(itemType, id, logoFile);
    }
  }

  function _startMainAnim() {
    wuVideo.oncanplay = null;
    wuVideo.onerror   = null;
    if (!animFile) {
      if (!introFile) _showLogo();
      return;
    }
    // Snapshot last intro frame to canvas so there's no black flash during src swap
    if (introFile && wuVideo.videoWidth) {
      wuFrameHold.width  = wuVideo.offsetWidth  || window.innerWidth;
      wuFrameHold.height = wuVideo.offsetHeight || window.innerHeight;
      wuFrameHold.getContext('2d').drawImage(wuVideo, 0, 0, wuFrameHold.width, wuFrameHold.height);
      wuFrameHold.style.display = 'block';
    }
    const animUrl = `/assets/${itemType}/${id}/${animFile}`;
    wuVideo.loop = true;
    wuVideo.onerror   = () => { wuFrameHold.style.display = 'none'; wuVideo.style.display = 'none'; _showLogo(); };
    wuVideo.oncanplay = () => {
      wuVideo.style.display = 'block';
      wuVideo.play().then(() => {
        wuFrameHold.style.display = 'none';
      }).catch(() => { wuFrameHold.style.display = 'none'; wuVideo.style.display = 'none'; _showLogo(); });
    };
    wuVideo.src = animUrl;
    wuVideo.load();
  }

  if (introFile) {
    const introUrl = `/assets/${itemType}/${id}/${introFile}`;
    wuVideo.loop    = false;
    wuVideo.onerror = () => { wuVideo.style.display = 'none'; _startMainAnim(); };
    wuVideo.oncanplay = () => {
      wuVideo.style.display = 'block';
      wuVideo.play().catch(() => { wuVideo.style.display = 'none'; _startMainAnim(); });
    };
    wuVideo.onended = () => { wuVideo.onended = null; _startMainAnim(); };
    wuVideo.src = introUrl;
    wuVideo.load();
  } else if (animFile) {
    _startMainAnim();
  } else {
    _showLogo();
  }

  // Fade IN — stays until next step or explicit clear
  setLayerTransition(0.8);
  layerStandby.style.opacity = '0';
  layerTitle.style.opacity   = '0';
  layerWalkup.style.opacity  = '1';
  layerWalkup.style.pointerEvents = 'auto';
}

function tryLogo(itemType, id, logoFile) {
  const src = logoFile
    ? `/assets/${itemType}/${id}/${logoFile}?t=${Date.now()}`
    : `/assets/${itemType}/${id}/logo.png?t=${Date.now()}`;
  wuLogo.onerror = () => { wuLogo.style.display = 'none'; };
  wuLogo.onload  = () => { wuLogo.style.display = 'block'; };
  wuLogo.src = src;
}

function showStandby(fadeDurMs) {
  hideLeaderboard();
  hideSlide();
  standbyActive = true;
  _displaySeq++; // cancel any pending showStep image load

  const dur = fadeDurMs || 1200;
  const t = `opacity ${dur / 1000}s ease`;
  layerStandby.style.transition = t;
  layerWalkup.style.transition  = t;
  layerTitle.style.transition   = t;

  layerWalkup.style.opacity  = '0';
  layerWalkup.style.pointerEvents = 'none';
  layerTitle.style.opacity   = '0';
  layerStandby.style.opacity = '1';

  setTimeout(() => {
    wuVideo.pause();
    wuVideo.src = '';
    wuLogo.style.display = 'none';
    wuLogo.src = '';
    _resetTitleVideo();
  }, dur + 200);
}

function setLayerTransition(seconds) {
  const t = `opacity ${seconds}s ease`;
  layerStandby.style.transition = t;
  layerWalkup.style.transition  = t;
  layerTitle.style.transition   = t;
}

// ── SLIDE ─────────────────────────────────────────────────────────────────────
const _SLIDE_ACCENTS = {amber:'#F5A623', blue:'#4A9FD4', green:'#3CB96A', white:'#FFFFFF', red:'#E83A3A'};

function showSlide(data) {
  if (!data || !data.template) return;
  _displaySeq++;        // cancel any pending showStep/showTitleVideo load callbacks
  _resetTitleVideo();   // stop any title video still playing under us
  const acc = (data.theme && data.theme.startsWith('#')) ? data.theme : (_SLIDE_ACCENTS[data.theme] || _SLIDE_ACCENTS.amber);
  layerSlide.style.setProperty('--sl-a', acc);
  const [r,g,b] = [parseInt(acc.slice(1,3),16), parseInt(acc.slice(3,5),16), parseInt(acc.slice(5,7),16)];
  layerSlide.style.background = `radial-gradient(ellipse at 50% 40%, rgba(${r},${g},${b},.07) 0%, #060504 65%)`;

  const H = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let html = '';
  if (data.template === 'big_title') {
    html = `<div class="sl-big"><div class="sl-head">${H(data.headline)}</div>${data.subtitle?`<div class="sl-sub">${H(data.subtitle)}</div>`:''}</div>`;
  } else if (data.template === 'bulletin') {
    const lines = (data.lines||'').split('\n').filter(l=>l.trim()).map(l=>`<div class="sl-line">${H(l)}</div>`).join('');
    html = `<div class="sl-bul"><div class="sl-head">${H(data.headline)}</div><div class="sl-rule"></div>${lines}</div>`;
  } else if (data.template === 'next_event') {
    html = `<div class="sl-nxt"><div class="sl-label">${H(data.label||'NEXT CAMP')}</div><div class="sl-rule"></div><div class="sl-name">${H(data.event_name)}</div>${data.date_text?`<div class="sl-date">${H(data.date_text)}</div>`:''}</div>`;
  } else if (data.template === 'spotlight') {
    const img = data.image ? `<img class="sl-img" src="/assets/${H(data.image)}" alt="">` : '';
    html = `<div class="sl-spot">${img}<div class="sl-txt"><div class="sl-head">${H(data.headline)}</div>${data.subtitle?`<div class="sl-sub">${H(data.subtitle)}</div>`:''}</div></div>`;
  } else if (data.template === 'qr') {
    const qimg = data.qr_data_url ? `<img class="sl-qimg" src="${data.qr_data_url}" alt="QR">` : '';
    html = `<div class="sl-qr"><div class="sl-head">${H(data.headline)}</div>${data.body?`<div class="sl-body">${H(data.body)}</div>`:''}<div class="sl-rule" style="width:20vw;margin:1.2vw auto"></div>${qimg}${data.qr_url?`<div class="sl-url">${H(data.qr_url)}</div>`:''}</div>`;
  }
  layerSlide.innerHTML = html;

  const t = 'opacity .7s ease';
  [layerWalkup, layerTitle, layerStandby, layerSlide].forEach(l => l.style.transition = t);
  layerWalkup.style.opacity  = '0'; layerWalkup.style.pointerEvents  = 'none';
  layerTitle.style.opacity   = '0';
  layerStandby.style.opacity = '0';
  layerSlide.style.opacity   = '1'; layerSlide.style.pointerEvents   = 'auto';
  hideLeaderboard();
  standbyActive = false;
}

function hideSlide() {
  layerSlide.style.transition   = 'opacity .7s ease';
  layerSlide.style.opacity      = '0';
  layerSlide.style.pointerEvents = 'none';
}

function blackout() {

// ── CHRONO OVERLAY (countdown + stopwatch) ────────────────────────────────────
const layerTimer  = document.getElementById('layer-timer');
const timerNum    = document.getElementById('timer-num');
const chronoLabel = document.getElementById('chrono-label');
let _timerVisible  = false;
let _chronoMode    = 'countdown'; // 'countdown' | 'stopwatch'
let _chronoSource  = 'none';      // 'skit' | 'countdown' | 'stopwatch'
let _swStartMs     = null;
let _swInterval    = null;

function showChronoOverlay(mode, data, source) {
  _chronoMode = mode;
  _chronoSource = source || 'skit';
  _timerVisible = true;
  if (mode === 'stopwatch') {
    timerNum.style.color = '#3CB96A';
    chronoLabel.textContent = 'ELAPSED';
    _swStartMs = data.start_ms || Date.now();
    clearInterval(_swInterval);
    _swInterval = setInterval(_updateSwNum, 100);
  } else {
    timerNum.style.color = '#F5A623';
    chronoLabel.textContent = 'REMAINING';
    _updateTimerNum(data.seconds || data.seconds_remaining || 0);
  }
  layerTimer.style.opacity = '1';
}

function hideChronoOverlay(source) {
  if (source && _chronoSource !== source) return;
  _timerVisible = false;
  _chronoSource = 'none';
  clearInterval(_swInterval);
  layerTimer.style.opacity = '0';
  setTimeout(() => {
    if (!_timerVisible) {
      _chronoMode = 'countdown';
      timerNum.style.color = '#F5A623';
      chronoLabel.textContent = 'REMAINING';
    }
  }, 900);
}

function _updateTimerNum(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  timerNum.textContent = m > 0 ? m + ':' + String(s).padStart(2, '0') : String(s);
  timerNum.style.color = sec <= 5 ? '#FF3333' : sec <= 10 ? '#FF8800' : '#F5A623';
}

function _updateSwNum() {
  if (!_swStartMs) return;
  const elapsed = (Date.now() - _swStartMs) / 1000;
  const m = Math.floor(elapsed / 60);
  const s = Math.floor(elapsed % 60);
  const t = Math.floor((elapsed % 1) * 10);
  timerNum.textContent = m > 0
    ? m + ':' + String(s).padStart(2, '0') + '.' + t
    : s + '.' + t;
}

function handleTimerState(data) {
  if (!_timerVisible || _chronoSource !== 'skit') return;
  const sec = data.seconds_remaining || 0;
  _updateTimerNum(sec);
  if (!data.running && sec <= 0) hideChronoOverlay('skit');
}

function handleCountdownState(data) {
  if (!_timerVisible || _chronoSource !== 'countdown') return;
  const sec = data.seconds_remaining || 0;
  _updateTimerNum(sec);
  if (!data.running && sec <= 0) hideChronoOverlay('countdown');
}

function handleStopwatchState(data) {
  if (data.running && data.show_on_display) {
    showChronoOverlay('stopwatch', {start_ms: data.start_ms}, 'stopwatch');
  } else if (!data.running && _chronoSource === 'stopwatch') {
    clearInterval(_swInterval);
    if (data.elapsed_ms) {
      const elapsed = data.elapsed_ms / 1000;
      const m = Math.floor(elapsed / 60);
      const s = Math.floor(elapsed % 60);
      const t = Math.floor((elapsed % 1) * 10);
      timerNum.textContent = m > 0
        ? m + ':' + String(s).padStart(2, '0') + '.' + t
        : s + '.' + t;
    }
    if (_timerVisible) setTimeout(() => hideChronoOverlay('stopwatch'), 3000);
  }
}

// ── WEBSOCKET ─────────────────────────────────────────────────────────────────
let _pingTimer       = null;
let _wsFirstConnect  = true; // true until we've had one successful connection

function connectWS() {
  const ws = new WebSocket('ws://' + location.host + '/ws');

  ws.onopen = () => {
    if (_wsFirstConnect) {
      // First connect: load standby config (handles Chromium beating musicman to start)
      _wsFirstConnect = false;
      loadStandbyConfig();
      fetch('/api/state').then(r=>r.json()).then(s=>{
        _startupId = s.startup_id || null;
        if (s.slide && s.slide.template) showSlide(s.slide);
      }).catch(()=>{});
    } else {
      // Reconnect: check if the service actually restarted (startup_id changed)
      // vs. a mere network hiccup. Only hard-navigate on a true restart.
      fetch('/api/state').then(r=>r.json()).then(s=>{
        if (s.startup_id && _startupId && s.startup_id !== _startupId) {
          // Service restarted — get fresh HTML
          location.href = '/display?v=' + Date.now();
        }
        // else: network hiccup, service still running — stay on current display
      }).catch(()=>{
        // Can't reach server yet; retry will happen via ws reconnect loop
      });
      return;
    }
    // Keepalive ping every 20s — prevents the server's 30s receive-timeout
    // from dropping the connection mid-show.
    clearInterval(_pingTimer);
    _pingTimer = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send('ping');
    }, 20000);
  };

  ws.onmessage = (evt) => {
    try {
      const msg  = JSON.parse(evt.data);
      const data = msg.data || {};

      if      (msg.event === 'display_walkup')    { hideChronoOverlay(); hideViz(); showWalkup(data); }
      else if (msg.event === 'display_step')      { hideChronoOverlay(); hideViz(); showStep(data); }
      else if (msg.event === 'display_animation') { hideChronoOverlay(); hideViz(); showTitleVideo(data); }
      else if (msg.event === 'display_clear')     { hideChronoOverlay(); hideViz(); blackout(); }
      else if (msg.event === 'display_standby')   { hideChronoOverlay(); hideViz(); showStandby(); }
      else if (msg.event === 'display_slide')     { hideChronoOverlay(); showSlide(data); }
      else if (msg.event === 'display_slide_clear') { hideSlide(); }
      else if (msg.event === 'display_leaderboard') { hideChronoOverlay(); hideViz(); showLeaderboard(data); }
      else if (msg.event === 'timer_hide')        { hideChronoOverlay(); }
      else if (msg.event === 'display_reload')    { location.href = '/display?v=' + Date.now(); }
      else if (msg.event === 'display_navigate')  { location.href = data.url; }
      else if (msg.event === 'timer_show')        { showChronoOverlay('countdown', {seconds: data.seconds || 0}, 'skit'); }
      else if (msg.event === 'timer_warning')     { showChronoOverlay('countdown', {seconds: data.seconds_remaining || 0}, 'skit'); }
      else if (msg.event === 'timer_state')       { handleTimerState(data); }
      else if (msg.event === 'timer_expired')     { hideChronoOverlay('skit'); }
      else if (msg.event === 'countdown_show')    { showChronoOverlay('countdown', {seconds: data.seconds}, 'countdown'); }
      else if (msg.event === 'countdown_state')   { handleCountdownState(data); }
      else if (msg.event === 'countdown_expired') { hideChronoOverlay('countdown'); }
      else if (msg.event === 'stopwatch_state')   { handleStopwatchState(data); }
      else if (msg.event === 'viz_show')    { if (data.scene === 'crowd') showCrowdViz(data.settings); else showMusicViz(data.settings); }
      else if (msg.event === 'viz_hide')    { hideViz(); }
      else if (msg.event === 'viz_music')   { _eqReceive(data); }
      else if (msg.event === 'viz_crowd')   { _crowdReceive(data); }
      else if (msg.event === 'viz_overlay') { if (data.action === 'hide') _overlayHide(); else _overlayPlay(data); }
    } catch(e) {}
  };

  ws.onclose = () => { clearInterval(_pingTimer); setTimeout(connectWS, 3000); };
  ws.onerror = () => ws.close();
}

let _activeViz = null;

// ── VIZ: MUSIC EQ ────────────────────────────────────────────────────────────
const _eqLayer  = document.getElementById('layer-viz-music');
const _eqCanvas = document.getElementById('eq-canvas');
const _eqCtx    = _eqCanvas.getContext('2d');
const EQ_MAX    = 32;   // maximum bars (array capacity)
let   _eqBarCount = 24; // runtime bar count (16 | 24 | 32)

const _eqSmooth  = new Float32Array(EQ_MAX);
const _eqTarget  = new Float32Array(EQ_MAX);
const _eqPeak    = new Float32Array(EQ_MAX);
const _eqPeakTtl = new Int32Array(EQ_MAX);
let _eqBeat    = 0;
let _eqTrack   = '';
let _eqRunning = false;
let _eqColors  = { low: '#c84a0a', mid: '#f5a623', high: '#fffff0' };

function _drawEQ() {
  if (!_eqRunning) return;
  const W = _eqCanvas.width, H = _eqCanvas.height, ctx = _eqCtx;

  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);

  if (_eqBeat > 0) {
    ctx.fillStyle = `rgba(245,166,35,${(_eqBeat * 0.10).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    _eqBeat = Math.max(0, _eqBeat - 0.055);
  }

  const N = _eqBarCount;
  for (let i = 0; i < N; i++) {
    _eqSmooth[i] = _eqTarget[i] > _eqSmooth[i]
      ? _eqTarget[i]
      : Math.max(0, _eqSmooth[i] - 0.020);
    _eqTarget[i] = Math.max(0, _eqTarget[i] - 0.012);

    if (_eqSmooth[i] >= _eqPeak[i]) {
      _eqPeak[i] = _eqSmooth[i]; _eqPeakTtl[i] = 45;
    } else if (--_eqPeakTtl[i] < 0) {
      _eqPeak[i] = Math.max(0, _eqPeak[i] - 0.005);
    }
  }

  const baseline = H * 0.64;
  const maxBarH  = baseline * 0.93;
  const totalW   = W * 0.86;
  const startX   = (W - totalW) / 2;
  const slot     = totalW / N;
  const barW     = slot * 0.70;
  const gapH     = slot * 0.30;

  // Build bar gradient colors from _eqColors
  function eqGrad(top) {
    const g = ctx.createLinearGradient(0, baseline, 0, top);
    g.addColorStop(0,    _eqColors.low  + 'dd');
    g.addColorStop(0.45, _eqColors.mid  + 'eb');
    g.addColorStop(1,    _eqColors.high + 'fa');
    return g;
  }

  for (let i = 0; i < N; i++) {
    const x    = startX + i * slot + gapH / 2;
    const barH = _eqSmooth[i] * maxBarH;
    const pkH  = _eqPeak[i]   * maxBarH;
    if (barH < 1) continue;

    const top  = baseline - barH;
    ctx.fillStyle = eqGrad(top);
    ctx.fillRect(x, top, barW, barH);

    // Glow cap
    ctx.shadowColor = _eqColors.mid + 'a6';
    ctx.shadowBlur  = 14;
    ctx.fillStyle   = _eqColors.high + `${Math.round(_eqSmooth[i] * 255).toString(16).padStart(2,'0')}`;
    ctx.fillRect(x, top, barW, 3);
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

    // Mirror reflection
    const mGrad = ctx.createLinearGradient(0, baseline, 0, baseline + barH * 0.26);
    mGrad.addColorStop(0, _eqColors.low + '52');
    mGrad.addColorStop(1, _eqColors.low + '00');
    ctx.fillStyle = mGrad;
    ctx.fillRect(x, baseline, barW, barH * 0.26);

    // Peak hold dot
    if (pkH > 3 && _eqSmooth[i] < _eqPeak[i] - 0.04) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(x, baseline - pkH - 2, barW, 2);
    }
  }

  // Baseline rule
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(startX, baseline); ctx.lineTo(startX + totalW, baseline);
  ctx.stroke();

  // Track name
  if (_eqTrack) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font      = `400 ${Math.round(W * 0.016)}px 'Barlow Condensed','Arial Narrow',Arial,sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(_eqTrack.toUpperCase(), W / 2, H - 26);
  }

  requestAnimationFrame(_drawEQ);
}

function _eqReceive(data) {
  const raw = data.fft || [], n = raw.length || 1, N = _eqBarCount;
  for (let i = 0; i < N; i++) {
    const src = Math.min(n - 1, Math.floor(Math.pow(i / (N - 1), 0.65) * n));
    const v = raw[src] || 0;
    if (v > _eqTarget[i]) _eqTarget[i] = v;
  }
  if (data.beat)  _eqBeat  = 1.0;
  if (data.track) _eqTrack = data.track;
}

// ── VIZ: CROWD — VU METER + LED BARS ─────────────────────────────────────────
const _crowdLayer   = document.getElementById('layer-viz-crowd');
const _crowdCanvas  = document.getElementById('crowd-canvas');
const _crowdCtx     = _crowdCanvas.getContext('2d');
// Two overlay elements — we always load into the hidden one and crossfade to avoid GPU texture flash
const _overlayA     = document.getElementById('crowd-overlay-video-a');
const _overlayB     = document.getElementById('crowd-overlay-video-b');
let   _activeOv     = _overlayA;   // currently visible
let   _stagingOv    = _overlayB;   // loading target

let _crowdTarget    = 0;
let _crowdSmoothed  = 0;
let _crowdLastTick  = 0;  // performance.now() of last draw frame
let _crowdClimax   = false;
let _climaxFrame   = 0;
let _particles     = [];
let _lightningArcs = [];
let _crowdRunning  = false;
let _crowdVizType  = 'needle_bars';  // needle_bars | bars_only | needle_only | needle_number | needle_bars_number | bars_number
let _crowdColors   = { low: '#3cb96a', mid: '#f5a623', high: '#e74c3c' };
let _crowdFrame    = 0;

// Per-column wobble phases for animated bars (14 columns max)
const _colPhases = Float32Array.from({length: 14}, () => Math.random() * Math.PI * 2);
const _colFreqs  = Float32Array.from({length: 14}, (_, i) => 0.038 + i * 0.004 + Math.random() * 0.008);

// Interpolate between the 3 user colors based on level 0-1
function _crowdColorAt(lv) {
  function h2r(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  const [lr,lg,lb] = h2r(_crowdColors.low);
  const [mr,mg,mb] = h2r(_crowdColors.mid);
  const [hr,hg,hb] = h2r(_crowdColors.high);
  let r,g,b;
  if (lv < 0.5) { const t=lv*2; r=lr+(mr-lr)*t; g=lg+(mg-lg)*t; b=lb+(mb-lb)*t; }
  else           { const t=(lv-0.5)*2; r=mr+(hr-mr)*t; g=mg+(hg-mg)*t; b=mb+(hb-mb)*t; }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// Color for a specific LED segment row (0=bottom, N_SEG-1=top)
function _segColor(s, N_SEG) {
  const frac = s / (N_SEG - 1);
  return _crowdColorAt(frac);
}

const _MAX_PARTICLES = 120;

function _spawnSparks(W, H, n, cx, cy, R) {
  if (_particles.length >= _MAX_PARTICLES) return;
  const deg = (205 + _crowdSmoothed * 130) * Math.PI / 180;
  const nx = cx + R * 0.89 * Math.cos(deg);
  const ny = cy + R * 0.89 * Math.sin(deg);

  const room = _MAX_PARTICLES - _particles.length;
  for (let i = 0; i < Math.min(n, room); i++) _particles.push({
    x: nx, y: ny,
    vx: (Math.random() - 0.5) * 22,
    vy: -(Math.random() * 14 + 3),
    life: 0,
    max: 60 + Math.random() * 40,
    sz:  5 + Math.random() * 10,
  });

  // Lightning arcs: only spawn when particle pool has room to breathe
  if (_lightningArcs.length < 4) {
    const numArcs = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numArcs; i++) {
      const spreadDeg = (Math.random() * 260 - 220) * Math.PI / 180;
      const dist = 90 + Math.random() * 160;
      _lightningArcs.push({
        sx: nx, sy: ny,
        ex: nx + Math.cos(spreadDeg) * dist,
        ey: ny + Math.sin(spreadDeg) * dist,
        life: 0,
        max: 7 + Math.floor(Math.random() * 5),
      });
    }
  }
}

function _drawLightning(ctx) {
  // single-pass — no shadowBlur, just bright stroked zigzag
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';
  for (let i = _lightningArcs.length - 1; i >= 0; i--) {
    const arc = _lightningArcs[i];
    arc.life++;
    if (arc.life > arc.max) { _lightningArcs.splice(i, 1); continue; }
    const a  = 1 - arc.life / arc.max;
    const dx = arc.ex - arc.sx, dy = arc.ey - arc.sy;
    // thick amber-white bolt
    ctx.strokeStyle = `rgba(255,230,80,${(a * 0.9).toFixed(2)})`;
    ctx.lineWidth   = 1.5 + a * 2.5;
    ctx.beginPath();
    ctx.moveTo(arc.sx, arc.sy);
    for (let s = 1; s <= 10; s++) {
      const t = s / 10;
      const j = s < 10 ? (Math.random() - 0.5) * 40 : 0;
      ctx.lineTo(arc.sx + dx * t + j, arc.sy + dy * t + j);
    }
    ctx.stroke();
  }
}

function _drawParticles(ctx, lv) {
  // No per-particle save/restore or shadowBlur — batch all in one path set
  const [sr, sg, sb] = lv > 0.78 ? [255, 60, 15] : [255, 200, 50];
  for (let i = _particles.length - 1; i >= 0; i--) {
    const p = _particles[i];
    p.x  += p.vx; p.y += p.vy;
    p.vy += 0.28; p.vx *= 0.97;
    p.life++;
    if (p.life > p.max) { _particles.splice(i, 1); continue; }
    const a = (1 - p.life / p.max) * 0.95;
    ctx.fillStyle = `rgba(${sr},${sg},${sb},${a.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.sz * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── SHARED DRAWING HELPERS ─────────────────────────────────────────────────────

function _drawLEDBank(ctx, bankX, bankW, H, lv, colCount, animated) {
  const N_SEG  = 18;
  const BAR_TOP = H * 0.08, BAR_BOT = H * 0.88;
  const SEG_UNIT = (BAR_BOT - BAR_TOP) / N_SEG;
  const SEG_H   = SEG_UNIT * 0.80;
  const colW    = bankW / colCount;
  const segW    = colW * 0.70;
  const xOff    = (colW - segW) / 2;
  for (let c = 0; c < colCount; c++) {
    // Animate each column independently
    let colLv = lv;
    if (animated) {
      const wobble = lv * 0.16 * Math.sin(_crowdFrame * _colFreqs[c] + _colPhases[c]);
      colLv = Math.max(0, Math.min(1, lv + wobble));
    }
    const litN = Math.min(N_SEG, Math.round(colLv * N_SEG));
    for (let s = 0; s < N_SEG; s++) {
      const lit    = s < litN;
      const topIdx = N_SEG - 1 - s;
      const y      = BAR_TOP + topIdx * SEG_UNIT;
      const x      = bankX + c * colW + xOff;
      const col    = _segColor(s, N_SEG);
      // Parse rgb for alpha
      const opacity = lit ? 0.92 : 0.08;
      ctx.fillStyle = lit ? col.replace('rgb(', 'rgba(').replace(')', `,${opacity})`) :
                            col.replace('rgb(', 'rgba(').replace(')', `,${opacity})`);
      if (lit) { ctx.shadowColor = col; ctx.shadowBlur = 7; }
      ctx.fillRect(x, y, segW, SEG_H);
      if (lit) { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
    }
  }
}

function _drawNeedle(ctx, W, H, lv, R_scale) {
  const CX = W / 2, CY = H * 0.82;
  const R   = Math.min(W * (R_scale || 0.30), H * 0.68);
  const t2r = d => d * Math.PI / 180;
  const VU_A = 205, VU_B = 335, VU_SW = 130;
  const shake     = _crowdClimax ? (Math.random() - 0.5) * 5 : 0;
  const needleDeg = VU_A + lv * VU_SW + shake;
  const hiColor   = _crowdColors.high;
  const loColor   = _crowdColors.low;
  const midColor  = _crowdColors.mid;

  // Meter face
  ctx.beginPath(); ctx.moveTo(CX, CY);
  ctx.arc(CX, CY, R, t2r(VU_A), t2r(VU_B), false);
  ctx.closePath();
  ctx.fillStyle = 'rgba(12,9,7,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,65,40,0.55)';
  ctx.lineWidth = 2; ctx.stroke();

  // Zone arcs using user colors
  const R_OUT = R * 0.97, R_IN = R * 0.74, RM = (R_OUT + R_IN) / 2;
  ctx.lineWidth = R_OUT - R_IN; ctx.lineCap = 'butt';
  const gE = VU_A + VU_SW * 0.58, yE = VU_A + VU_SW * 0.80;
  ctx.beginPath(); ctx.arc(CX, CY, RM, t2r(VU_A), t2r(gE), false);
  ctx.strokeStyle = loColor + '55'; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, RM, t2r(gE), t2r(yE), false);
  ctx.strokeStyle = midColor + '66'; ctx.stroke();
  const redA = lv > 0.80 ? Math.min(1, 0.42 + (lv - 0.80) * 3) : 0.42;
  ctx.beginPath(); ctx.arc(CX, CY, RM, t2r(yE), t2r(VU_B), false);
  ctx.strokeStyle = hiColor.replace('rgb(','rgba(').replace(')',`,${redA.toFixed(3)})`).replace('#','');
  // Simpler:
  ctx.strokeStyle = `rgba(220,30,20,${redA.toFixed(3)})`; ctx.stroke();
  ctx.lineWidth = 1; ctx.lineCap = 'butt';

  // Tick marks
  for (let i = 0; i <= 10; i++) {
    const rad = t2r(VU_A + (i/10) * VU_SW), major = (i%2===0);
    const r1 = R*(major?0.68:0.76), r2 = R*0.97;
    ctx.beginPath();
    ctx.moveTo(CX + r1*Math.cos(rad), CY + r1*Math.sin(rad));
    ctx.lineTo(CX + r2*Math.cos(rad), CY + r2*Math.sin(rad));
    ctx.strokeStyle = `rgba(210,185,145,${major?0.80:0.40})`;
    ctx.lineWidth = major ? 2.5 : 1; ctx.stroke();
  }

  // Scale labels
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `600 ${Math.round(R*0.095)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.fillStyle = 'rgba(215,190,145,0.72)';
  for (const [frac,label] of [[0,'0'],[0.25,'25'],[0.5,'50'],[0.75,'75'],[1,'100']]) {
    const rad = t2r(VU_A + frac*VU_SW), lr = R*0.57;
    ctx.fillText(label, CX + lr*Math.cos(rad), CY + lr*Math.sin(rad));
  }

  // Needle
  const nRad = t2r(needleDeg);
  const NX = CX + R*0.89*Math.cos(nRad), NY = CY + R*0.89*Math.sin(nRad);
  ctx.shadowColor = lv>0.55 ? `rgba(255,55,10,${((lv-0.55)/0.45*0.9).toFixed(3)})` : 'transparent';
  ctx.shadowBlur  = 24;
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(NX,NY);
  ctx.strokeStyle = lv>0.78 ? 'rgba(255,50,10,0.97)' : 'rgba(225,100,20,0.92)';
  ctx.lineWidth = Math.max(2.5, R*0.014); ctx.stroke();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';

  // Pivot cap
  ctx.beginPath(); ctx.arc(CX, CY, R*0.055, 0, Math.PI*2);
  ctx.fillStyle='rgba(185,130,65,0.92)'; ctx.fill();
  ctx.strokeStyle='rgba(120,80,30,0.8)'; ctx.lineWidth=2; ctx.stroke();

  return {CX, CY, R};
}

// ── CROWD VIZ DRAW MODES ───────────────────────────────────────────────────────

function _crowdDrawNeedleBars(ctx, W, H, lv) {
  const BANK_W = W * 0.185;
  _drawLEDBank(ctx, W*0.018, BANK_W, H, lv, 7, false);
  _drawLEDBank(ctx, W - W*0.018 - BANK_W, BANK_W, H, lv, 7, false);
  const {CX, CY, R} = _drawNeedle(ctx, W, H, lv, 0.30);
  ctx.fillStyle = `rgba(195,170,125,${(0.45+lv*0.50).toFixed(3)})`;
  ctx.font = `700 ${Math.round(H*0.038)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('CROWD LEVEL', W/2, H*0.895);
  return {CX, CY, R};
}

function _crowdDrawBarsOnly(ctx, W, H, lv) {
  // 3 wide animated banks spanning the full width
  const BANK_W = W * 0.30;
  const GAP    = (W - 3 * BANK_W) / 4;
  _drawLEDBank(ctx, GAP,             BANK_W, H, lv, 9, true);
  _drawLEDBank(ctx, GAP*2 + BANK_W,  BANK_W, H, lv, 9, true);
  _drawLEDBank(ctx, GAP*3 + BANK_W*2,BANK_W, H, lv, 9, true);
  // Level number at bottom center
  const numStr = Math.round(lv * 100) + '%';
  ctx.fillStyle = _crowdColorAt(lv);
  ctx.font = `800 ${Math.round(H*0.10)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(numStr, W/2, H*0.97);
}

function _crowdDrawNeedleOnly(ctx, W, H, lv) {
  const {CX, CY, R} = _drawNeedle(ctx, W, H, lv, 0.38);
  ctx.fillStyle = `rgba(195,170,125,${(0.45+lv*0.50).toFixed(3)})`;
  ctx.font = `700 ${Math.round(H*0.038)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('CROWD LEVEL', W/2, H*0.895);
}

function _crowdDrawNeedleNumber(ctx, W, H, lv) {
  const {CX, CY, R} = _drawNeedle(ctx, W, H, lv, 0.32);
  // Big number inside the meter face
  const numStr = Math.round(lv * 100) + '%';
  ctx.fillStyle = _crowdColorAt(lv);
  ctx.font = `800 ${Math.round(R*0.44)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(numStr, CX, CY - R*0.26);
  ctx.fillStyle = 'rgba(195,170,125,0.55)';
  ctx.font = `700 ${Math.round(H*0.030)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText('CROWD LEVEL', W/2, H*0.895);
}

function _crowdDrawNeedleBarsNumber(ctx, W, H, lv) {
  const BANK_W = W * 0.185;
  _drawLEDBank(ctx, W*0.018, BANK_W, H, lv, 7, false);
  _drawLEDBank(ctx, W - W*0.018 - BANK_W, BANK_W, H, lv, 7, false);
  const {CX, CY, R} = _drawNeedle(ctx, W, H, lv, 0.30);
  // Number inside face
  const numStr = Math.round(lv * 100) + '%';
  ctx.fillStyle = _crowdColorAt(lv);
  ctx.font = `800 ${Math.round(R*0.38)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(numStr, CX, CY - R*0.24);
  ctx.fillStyle = `rgba(195,170,125,${(0.45+lv*0.50).toFixed(3)})`;
  ctx.font = `700 ${Math.round(H*0.030)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText('CROWD LEVEL', W/2, H*0.895);
}

function _crowdDrawBarsNumber(ctx, W, H, lv) {
  const BANK_W = W * 0.44;
  _drawLEDBank(ctx, W*0.018, BANK_W, H, lv, 12, true);
  _drawLEDBank(ctx, W - W*0.018 - BANK_W, BANK_W, H, lv, 12, true);
  // Big number in the gap between the two banks
  const numStr = Math.round(lv * 100) + '%';
  ctx.fillStyle = _crowdColorAt(lv);
  ctx.font = `800 ${Math.round(W*0.10)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(numStr, W/2, H*0.5);
  ctx.fillStyle = 'rgba(195,170,125,0.55)';
  ctx.font = `600 ${Math.round(H*0.028)}px 'Barlow Condensed',Arial,sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText('CROWD LEVEL', W/2, H*0.895);
}

// ── CROWD VIZ MAIN LOOP ────────────────────────────────────────────────────────

function _drawCrowd() {
  if (!_crowdRunning) return;

  // Cap at 24fps — saves significant CPU on the Pi
  const _now = performance.now();
  if (_crowdLastTick > 0 && (_now - _crowdLastTick) < 40) {
    requestAnimationFrame(_drawCrowd);
    return;
  }

  const W = _crowdCanvas.width, H = _crowdCanvas.height, ctx = _crowdCtx;
  _crowdFrame++;

  const _dt  = Math.min((_crowdLastTick > 0 ? _now - _crowdLastTick : 41), 80) / 1000;
  _crowdLastTick = _now;
  const _diff  = _crowdTarget - _crowdSmoothed;
  // exponential approach: 95% in ~4s rising, ~2s falling — frame-rate independent
  const _rate  = _diff > 0 ? 0.75 : 1.5;
  const _alpha = 1 - Math.exp(-_rate * _dt);
  _crowdSmoothed += _diff * _alpha;
  // gentle needle wavering near target, like a real gauge
  if (Math.abs(_diff) < 0.06 && _crowdTarget > 0) {
    const _t = _now / 1000;
    _crowdSmoothed += 0.006 * Math.sin(_t * 0.7) + 0.003 * Math.sin(_t * 1.9 + 1.2);
  }
  const lv = Math.max(0, Math.min(1, _crowdSmoothed));

  _climaxFrame   = 0;
  _lightningArcs.length = 0;
  if (_crowdClimax) _crowdSmoothed = 1.0; // keep needle pegged at max while video plays

  // Background + ambient glow
  ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, W, H);
  if (lv > 0.55) {
    const a = ((lv - 0.55) / 0.45 * 0.18).toFixed(3);
    const gr = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, W*0.65);
    gr.addColorStop(0, `rgba(220,40,10,${a})`); gr.addColorStop(1, 'rgba(220,40,10,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  // Dispatch to mode
  switch (_crowdVizType) {
    case 'bars_only':           _crowdDrawBarsOnly(ctx, W, H, lv);          break;
    case 'needle_only':         _crowdDrawNeedleOnly(ctx, W, H, lv);        break;
    case 'needle_number':       _crowdDrawNeedleNumber(ctx, W, H, lv);      break;
    case 'needle_bars_number':  _crowdDrawNeedleBarsNumber(ctx, W, H, lv);  break;
    case 'bars_number':         _crowdDrawBarsNumber(ctx, W, H, lv);        break;
    default:                    _crowdDrawNeedleBars(ctx, W, H, lv);        break;
  }

  requestAnimationFrame(_drawCrowd);
}

function _crowdReceive(data) {
  const newClimax = data.climax || false;
  _crowdTarget = Math.max(0, Math.min(1, (data.level || 0) / 100));
  if (newClimax && !_crowdClimax) _crowdSmoothed = _crowdTarget; // slam needle instantly
  _crowdClimax = newClimax;
}

// ── VIZ: VIDEO OVERLAY ───────────────────────────────────────────────────────
const _climaxVideo = document.getElementById('climax-fullscreen-video');

function _overlayPlay(data) {
  const src = data.src ? '/assets/display/' + data.src : '';
  if (!src) { _overlayHide(); return; }
  if (data.fullscreen) {
    _overlayHide();         // kill any looping text overlay immediately
    _climaxVideo.pause();
    _climaxVideo.oncanplay = null;
    _climaxVideo.loop    = data.loop !== false;
    _climaxVideo.onended = data.loop === false ? _climaxVideoHide : null;
    _climaxVideo.src = src;
    _climaxVideo.load();
    _climaxVideo.style.opacity = '1';
    _climaxVideo.play().catch(() => {});
  } else {
    // Load into the staging (hidden) element — never touch the visible one until first frame ready
    const next = _stagingOv;
    next.oncanplay = null;
    next.onended   = null;
    next.pause();
    next.style.opacity = '0';
    next.loop  = data.loop !== false;
    next.src   = src;
    next.load();
    next.play().catch(() => {});
    next.oncanplay = function() {
      next.oncanplay = null;
      next.onended   = data.loop === false ? _overlayHide : null;
      const prev = _activeOv;
      function _doSwap() {
        next.style.opacity = '1';
        prev.style.opacity = '0';
        prev.pause(); prev.src = ''; prev.load();
        _stagingOv = prev;
        _activeOv  = next;
      }
      // Wait until the GPU has committed the first real frame before showing
      if (next.requestVideoFrameCallback) {
        next.requestVideoFrameCallback(_doSwap);
      } else {
        requestAnimationFrame(() => requestAnimationFrame(_doSwap));
      }
    };
  }
}
function _overlayHide() {
  [_overlayA, _overlayB].forEach(v => {
    v.oncanplay = null; v.onended = null;
    v.pause(); v.src = ''; v.load();
    v.style.opacity = '0';
  });
  _activeOv  = _overlayA;
  _stagingOv = _overlayB;
}
function _climaxVideoHide() {
  _climaxVideo.pause();
  _climaxVideo.src = '';
  _climaxVideo.load();
  _climaxVideo.style.opacity = '0';
  // Hard cut — no fade, gauge is just gone
  _crowdRunning  = false;
  _crowdClimax   = false;
  _crowdLayer.style.transition = 'none';
  _crowdLayer.style.opacity    = '0';
}

// ── VIZ: SHOW / HIDE ─────────────────────────────────────────────────────────
function showMusicViz(settings) {
  if (settings) {
    if (settings.bars)        _eqBarCount      = Math.min(EQ_MAX, Math.max(8, parseInt(settings.bars) || 24));
    if (settings.color_low)   _eqColors.low    = settings.color_low;
    if (settings.color_mid)   _eqColors.mid    = settings.color_mid;
    if (settings.color_high)  _eqColors.high   = settings.color_high;
  }
  _activeViz = 'music';
  _resizeCanvas(_eqCanvas);
  _crowdRunning = false;
  if (!_eqRunning) { _eqRunning = true; requestAnimationFrame(_drawEQ); }
  _eqLayer.style.transition    = 'opacity 5s ease';
  _crowdLayer.style.transition = 'opacity 5s ease';
  _eqLayer.style.opacity    = '1';
  _crowdLayer.style.opacity = '0';
}

function showCrowdViz(settings) {
  // always start needle at zero
  _crowdTarget   = 0;
  _crowdSmoothed = 0;
  _crowdLastTick  = 0;
  _crowdClimax   = false;
  _climaxFrame   = 0;
  _particles     = [];
  _lightningArcs = [];
  if (settings) {
    if (settings.display_type)  _crowdVizType = settings.display_type;
    if (settings.color_low)     _crowdColors.low  = settings.color_low;
    if (settings.color_mid)     _crowdColors.mid  = settings.color_mid;
    if (settings.color_high)    _crowdColors.high = settings.color_high;
  }
  _activeViz = 'crowd';
  _resizeCanvas(_crowdCanvas);
  _eqRunning = false;
  if (!_crowdRunning) { _crowdRunning = true; requestAnimationFrame(_drawCrowd); }
  _crowdLayer.style.transition = 'opacity 5s ease';
  _eqLayer.style.transition    = 'opacity 5s ease';
  _crowdLayer.style.opacity = '1';
  _eqLayer.style.opacity    = '0';
}

function hideViz() {
  _activeViz     = null;
  _eqRunning     = false;
  _crowdRunning  = false;
  _crowdTarget   = 0;
  _crowdSmoothed = 0;
  _crowdLastTick  = 0;
  _crowdClimax   = false;
  _climaxFrame   = 0;
  _particles     = [];
  _lightningArcs = [];
  _eqLayer.style.transition    = 'opacity 5s ease';
  _crowdLayer.style.transition = 'opacity 5s ease';
  _eqLayer.style.opacity    = '0';
  _crowdLayer.style.opacity = '0';
  _overlayHide();
  _climaxVideoHide();
}

window.addEventListener('resize', () => {
  if (_activeViz === 'music') _resizeCanvas(_eqCanvas);
  if (_activeViz === 'crowd') _resizeCanvas(_crowdCanvas);
});

connectWS();
</script>
