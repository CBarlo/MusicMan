<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM — Countdown Timer</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root {
    --bg:        #0f1117;
    --bg2:       #161921;
    --bg3:       #1d2130;
    --surface:   #232838;
    --border:    #2e3448;
    --border2:   #404868;
    --text:      #e8ecf4;
    --text-dim:  #6b7494;
    --amber:     #F5A623;
    --amber-dim: rgba(245,166,35,.15);
    --green:     #3CB96A;
    --green-dim: rgba(60,185,106,.15);
    --red:       #E83A3A;
    --red-dim:   rgba(232,58,58,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    min-height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .heading { font-family:'Barlow Condensed','Arial Narrow',sans-serif; }

  .stage {
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:20px 20px 28px;
  }

  .brand-row { display:flex; align-items:center; gap:12px; width:100%; max-width:560px; margin-bottom:6px; }
  .brand-badge {
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:var(--amber-dim); border:1px solid var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:800; letter-spacing:1px; color:var(--amber); line-height:1.1; }
  .brand-sub  { font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .config-name { margin-left:auto; font-size:11px; letter-spacing:1px; color:var(--text-dim); text-align:right; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .status-badge {
    width:100%; max-width:560px; margin-top:18px;
    border-radius:16px; padding:22px 20px; text-align:center;
    border:2px solid var(--border2); background:var(--surface);
    transition:background .25s, border-color .25s;
  }
  .status-badge.running { border-color:var(--green); background:var(--green-dim); }
  .status-badge.paused  { border-color:var(--amber); background:var(--amber-dim); }
  .status-badge.stopped { border-color:var(--red);   background:var(--red-dim); }

  .status-label { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:14px; letter-spacing:3px; }
  .status-badge.running .status-label { color:var(--green); }
  .status-badge.paused  .status-label { color:var(--amber); }
  .status-badge.stopped .status-label { color:var(--red); }
  .timer-display {
    font-family:'Share Tech Mono',monospace; font-weight:700;
    font-size:56px; line-height:1.15; color:var(--text); letter-spacing:1px;
  }

  .admin { width:100%; max-width:560px; margin-top:18px; }
  .btn-row { display:flex; gap:10px; }
  .mm-btn {
    flex:1; padding:16px 10px; border-radius:10px; border:1px solid var(--border2);
    background:var(--bg3); color:var(--text); font-family:'Barlow Condensed',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:1px; cursor:pointer;
  }
  .mm-btn:active { filter:brightness(1.2); }
  .mm-btn.start { border-color:var(--green); background:var(--green-dim); color:var(--green); }
  .mm-btn.stop  { border-color:var(--red);   background:var(--red-dim);   color:var(--red); }

  .reset-row { margin-top:10px; }
  .reset-row .mm-btn { background:var(--bg2); color:var(--text-dim); font-size:12px; padding:10px; }

  .footer-hint { margin-top:16px; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:center; }

  /* ── DISPLAY MODE ──
     Nothing from this page is ever meant to reach the HDMI -- the Intro
     Game Entry (or fallback headline/text/image) is what shows there, and
     it just stays up for the whole event. This iframe just stays blank. */
  .display-mode .stage { display:none !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand-row">
    <div class="brand-badge">⏲️</div>
    <div>
      <div class="brand-name">COUNTDOWN TIMER</div>
      <div class="brand-sub">MusicMan</div>
    </div>
    <div class="config-name" id="configName"></div>
  </div>

  <div class="status-badge stopped" id="statusBadge">
    <div class="status-label" id="statusLabel">STOPPED</div>
    <div class="timer-display" id="timerDisplay">0:00</div>
  </div>

  <div class="admin">
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px">
      <input type="checkbox" id="showDisplay" onchange="setShowDisplay(this.checked)" style="width:16px;height:16px">
      <label for="showDisplay" style="font-size:11px;color:var(--text-dim);letter-spacing:.5px;cursor:pointer">Show the countdown on HDMI (otherwise the static screen stays up the whole time)</label>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="mm-btn start" id="startBtn" onclick="toggleTimer()">▶ START</button>
    </div>
    <div class="reset-row">
      <button class="mm-btn" onclick="resetTimer()">↺ RESET TIMER</button>
    </div>
    <div class="footer-hint">MC starts/pauses from the remote or here.</div>
  </div>
</div>

<script>
let _isDisplay = false;
let _configId  = null;

// ── TIMER (mirrors Console's own timer_state handling in musicman_ui.html,
// so a remote-fired start/pause and this page's own buttons both stay
// correct no matter which one drives it) ──
let timerRunning = false, timerPaused = false, timerSecs = 0, timerDuration = 180;

function toggleTimer() {
  if (!timerRunning) {
    timerRunning = true; setButtons();
    fetch('/api/timer/start').catch(() => {});
  } else {
    timerRunning = false; setButtons();
    fetch('/api/timer/pause').catch(() => {});
  }
}

function resetTimer() {
  timerRunning = false; timerPaused = false; timerSecs = timerDuration;
  renderTimer(); setButtons();
  fetch('/api/timer/reset').catch(() => {});
}

function setShowDisplay(val) {
  fetch('/api/timer/show_on_display', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ show: val }),
  }).catch(() => {});
}

function renderTimer() {
  const m = Math.floor(timerSecs / 60), s = timerSecs % 60;
  document.getElementById('timerDisplay').textContent = m + ':' + String(s).padStart(2, '0');
}

function setButtons() {
  const badge = document.getElementById('statusBadge');
  const label = document.getElementById('statusLabel');
  const btn   = document.getElementById('startBtn');
  badge.classList.remove('running', 'paused', 'stopped');
  if (timerRunning)      { badge.classList.add('running'); label.textContent = 'RUNNING'; }
  else if (timerPaused)  { badge.classList.add('paused');  label.textContent = 'PAUSED'; }
  else                   { badge.classList.add('stopped'); label.textContent = 'STOPPED'; }
  btn.textContent = timerRunning ? '⏸ PAUSE' : '▶ START';
  btn.classList.toggle('start', !timerRunning);
  btn.classList.toggle('stop', timerRunning);
}

// ── WEBSOCKET ──
let _ws = null;
function connectWS() {
  _ws = new WebSocket('ws://' + location.host + '/ws');
  _ws.onopen  = () => { _ws.send(JSON.stringify({event:'page_ready', url: location.pathname})); syncFromServer(); };
  _ws.onclose = () => setTimeout(connectWS, 3000);
  _ws.onerror = () => _ws.close();
  _ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.event === 'timer_state') applyTimerState(msg.data || {});
    } catch (e) {}
  };
}
connectWS();

function applyTimerState(data) {
  timerRunning = !!data.running;
  timerPaused  = !!data.paused;
  if (data.seconds_remaining !== undefined) timerSecs = data.seconds_remaining;
  if (data.duration !== undefined) timerDuration = data.duration;
  renderTimer(); setButtons();
  if (data.show_on_display !== undefined) {
    const chk = document.getElementById('showDisplay');
    if (chk) chk.checked = !!data.show_on_display;
  }
}

// Sync to whatever's actually running right now -- covers opening the
// controller mid-event (e.g. via Console's "jump to active game" button).
async function syncFromServer() {
  try {
    const st = await fetch('/api/state').then(r => r.json());
    if (st.timer) applyTimerState(st.timer);
  } catch (e) {}
}

(async function init() {
  const params = new URLSearchParams(location.search);
  _isDisplay = params.get('display') === '1';
  if (_isDisplay) document.body.classList.add('display-mode');

  _configId = params.get('config');
  if (_configId) {
    try {
      const cfg = await fetch(`/api/game_configs/${_configId}`).then(r => r.json());
      if (cfg && cfg.id) {
        document.getElementById('configName').textContent = cfg.name;
        document.title = 'MM Countdown — ' + cfg.name;
      }
    } catch (e) {}
  }

  await syncFromServer();
})();
</script>
</body>
</html>
