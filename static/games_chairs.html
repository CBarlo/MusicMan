<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM — Musical Chairs</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root {
    --bg:        #0f1117;
    --bg2:       #161921;
    --bg3:       #1d2130;
    --surface:   #232838;
    --border:    #2e3448;
    --border2:   #404868;
    --text:      #e8ecf4;
    --text-dim:  #6b7494;
    --amber:     #F5A623;
    --amber-dim: rgba(245,166,35,.15);
    --green:     #3CB96A;
    --green-dim: rgba(60,185,106,.15);
    --red:       #E83A3A;
    --red-dim:   rgba(232,58,58,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    min-height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .heading { font-family:'Barlow Condensed','Arial Narrow',sans-serif; }

  .stage {
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:20px 20px 28px;
  }

  .brand-row { display:flex; align-items:center; gap:12px; width:100%; max-width:560px; margin-bottom:6px; }
  .brand-badge {
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:var(--amber-dim); border:1px solid var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:800; letter-spacing:1px; color:var(--amber); line-height:1.1; }
  .brand-sub  { font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .config-name { margin-left:auto; font-size:11px; letter-spacing:1px; color:var(--text-dim); text-align:right; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .round-badge {
    font-family:'Barlow Condensed',sans-serif; font-weight:800; letter-spacing:2px;
    font-size:15px; color:var(--text-dim); text-transform:uppercase;
    margin-top:18px;
  }
  .round-num {
    font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:64px; line-height:1; color:var(--text); margin:2px 0 18px;
  }

  .status-badge {
    width:100%; max-width:560px;
    border-radius:16px; padding:26px 20px; text-align:center;
    border:2px solid var(--border2); background:var(--surface);
    transition:background .25s, border-color .25s;
  }
  .status-badge.playing { border-color:var(--green); background:var(--green-dim); }
  .status-badge.stopped { border-color:var(--red); background:var(--red-dim); animation:flashStop .5s ease 3; }
  @keyframes flashStop { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.6); } }

  .status-icon { font-size:40px; line-height:1; margin-bottom:6px; }
  .status-label { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:28px; letter-spacing:2px; }
  .status-badge.playing .status-label { color:var(--green); }
  .status-badge.stopped .status-label { color:var(--red); }
  .status-badge.idle    .status-label { color:var(--text-dim); }
  .status-sub { font-size:12px; color:var(--text-dim); margin-top:6px; letter-spacing:1px; }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }
  .status-badge.playing .status-icon { animation:pulse 1.1s ease-in-out infinite; }

  /* ── Operator controls (hidden in display mode) ── */
  .admin { width:100%; max-width:560px; margin-top:22px; }
  .field-label { display:block; font-size:10px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:5px; font-weight:700; text-transform:uppercase; }
  select.mm-select {
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:inherit; margin-bottom:14px;
  }
  .settings-row { display:flex; gap:14px; font-size:11px; color:var(--text-dim); letter-spacing:.5px; margin-bottom:18px; flex-wrap:wrap; }
  .settings-row b { color:var(--text); }

  .btn-row { display:flex; gap:10px; }
  .mm-btn {
    flex:1; padding:16px 10px; border-radius:10px; border:1px solid var(--border2);
    background:var(--bg3); color:var(--text); font-family:'Barlow Condensed',sans-serif;
    font-size:16px; font-weight:700; letter-spacing:1px; cursor:pointer;
  }
  .mm-btn:active { filter:brightness(1.2); }
  .mm-btn.start { border-color:var(--green); background:var(--green-dim); color:var(--green); }
  .mm-btn.stop  { border-color:var(--red);   background:var(--red-dim);   color:var(--red); }
  .mm-btn:disabled { opacity:.4; cursor:default; }

  .reset-row { margin-top:10px; }
  .reset-row .mm-btn { background:var(--bg2); color:var(--text-dim); font-size:12px; padding:10px; }

  .footer-hint { margin-top:16px; font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:center; }

  /* ── DISPLAY MODE ── */
  .display-mode .admin        { display:none !important; }
  .display-mode .footer-hint  { display:none; }
  .display-mode .stage        { justify-content:center; height:100vh; }
  .display-mode .brand-row    { max-width:900px; margin-bottom:0; }
  .display-mode .brand-badge  { width:56px; height:56px; font-size:28px; }
  .display-mode .brand-name   { font-size:30px; }
  .display-mode .round-badge  { font-size:22px; margin-top:36px; }
  .display-mode .round-num    { font-size:150px; margin-bottom:34px; }
  .display-mode .status-badge { max-width:820px; padding:56px 40px; border-radius:28px; border-width:3px; }
  .display-mode .status-icon  { font-size:90px; margin-bottom:14px; }
  .display-mode .status-label { font-size:56px; letter-spacing:4px; }
  .display-mode .status-sub   { font-size:18px; margin-top:12px; }
</style>
</head>
<body>

<div class="stage">
  <div class="brand-row">
    <div class="brand-badge">🪑</div>
    <div>
      <div class="brand-name">MUSICAL CHAIRS</div>
      <div class="brand-sub">MusicMan</div>
    </div>
    <div class="config-name" id="configName"></div>
  </div>

  <div class="round-badge">ROUND</div>
  <div class="round-num" id="roundNum">—</div>

  <div class="status-badge idle" id="statusBadge">
    <div class="status-icon" id="statusIcon">🎵</div>
    <div class="status-label" id="statusLabel">READY</div>
    <div class="status-sub" id="statusSub">Waiting to start</div>
  </div>

  <div class="admin">
    <label class="field-label" for="songSelect">Song</label>
    <select id="songSelect" class="mm-select"><option value="">— select a song —</option></select>

    <div class="settings-row" id="settingsRow"></div>

    <div class="btn-row">
      <button class="mm-btn start" id="startBtn" onclick="chairsStart()">▶ START</button>
      <button class="mm-btn stop"  id="stopBtn"  onclick="chairsStop()" disabled>⏹ STOP</button>
    </div>
    <div class="reset-row">
      <button class="mm-btn" onclick="chairsReset()">↺ RESET GAME</button>
    </div>
    <div class="footer-hint" id="footerHint">Pick a song, then tap START. Tap STOP any time to freeze the music.</div>
  </div>
</div>

<script>
let _isDisplay = false;
let _configId  = null;
let _cfgData   = {};
let _state     = { round: 0, playing: false, song: '', song_label: '' };

// ── WEBSOCKET ──
let _ws = null;
function connectWS() {
  _ws = new WebSocket('ws://' + location.host + '/ws');
  _ws.onopen  = () => { _ws.send(JSON.stringify({event:'page_ready', url: location.pathname})); };
  _ws.onclose = () => setTimeout(connectWS, 3000);
  _ws.onerror = () => _ws.close();
  _ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.event === 'chairs_state') applyState(msg.data || {});
    } catch(e) {}
  };
}
connectWS();

function applyState(s) {
  _state = { ..._state, ...s };
  document.getElementById('roundNum').textContent = _state.round > 0 ? _state.round : '—';

  const badge = document.getElementById('statusBadge');
  const icon  = document.getElementById('statusIcon');
  const label = document.getElementById('statusLabel');
  const sub   = document.getElementById('statusSub');
  badge.classList.remove('playing', 'stopped', 'idle');

  if (_state.round === 0) {
    badge.classList.add('idle');
    icon.textContent = '🎵'; label.textContent = 'READY'; sub.textContent = 'Waiting to start';
  } else if (_state.playing) {
    badge.classList.add('playing');
    icon.textContent = '♪'; label.textContent = 'PLAYING'; sub.textContent = _state.song_label || '';
  } else {
    badge.classList.add('stopped');
    icon.textContent = '⏹'; label.textContent = 'FREEZE!'; sub.textContent = 'Find a chair!';
  }

  const startBtn = document.getElementById('startBtn');
  const stopBtn  = document.getElementById('stopBtn');
  if (startBtn) startBtn.disabled = !!_state.playing;
  if (stopBtn)  stopBtn.disabled  = !_state.playing;
}

async function loadSongs(preselect) {
  const sel = document.getElementById('songSelect');
  if (!sel) return;
  try {
    const songs = await fetch('/api/music/list').then(r => r.json());
    sel.innerHTML = '<option value="">— select a song —</option>' +
      songs.map(f => `<option value="${f.replace(/"/g,'&quot;')}">${f}</option>`).join('');
    if (preselect) sel.value = preselect;
  } catch(e) {}
}

function renderSettings() {
  const row = document.getElementById('settingsRow');
  if (!row) return;
  if (!_configId) { row.innerHTML = ''; return; }
  const bits = [];
  if (_cfgData.auto_stop !== false) {
    bits.push(`Auto-stop <b>${_cfgData.min_interval ?? 15}–${_cfgData.max_interval ?? 45}s</b>`);
  } else {
    bits.push('Auto-stop <b>off</b> (manual only)');
  }
  if (_cfgData.stop_sfx)   bits.push('Cue SFX <b>set</b>');
  if (_cfgData.stop_scene) bits.push('Cue scene <b>set</b>');
  row.innerHTML = bits.map(b => `<span>${b}</span>`).join('<span>&middot;</span>');
}

async function chairsStart() {
  const song = document.getElementById('songSelect').value;
  if (!song) { alert('Pick a song first'); return; }
  document.getElementById('startBtn').disabled = true;
  try {
    const r = await fetch('/api/games/chairs/start', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ config_id: _configId, song }),
    });
    const d = await r.json();
    if (!d.ok) { alert(d.error || 'Could not start'); document.getElementById('startBtn').disabled = false; }
  } catch(e) { document.getElementById('startBtn').disabled = false; }
}

async function chairsStop() {
  document.getElementById('stopBtn').disabled = true;
  try {
    await fetch('/api/games/chairs/stop', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ config_id: _configId }),
    });
  } catch(e) {}
}

async function chairsReset() {
  try {
    await fetch('/api/games/chairs/reset', { method: 'POST' });
  } catch(e) {}
}

(async function init() {
  const params = new URLSearchParams(location.search);
  _isDisplay = params.get('display') === '1';
  if (_isDisplay) document.body.classList.add('display-mode');

  _configId = params.get('config');
  if (_configId) {
    try {
      const cfg = await fetch(`/api/game_configs/${_configId}`).then(r => r.json());
      if (cfg && cfg.id) {
        _cfgData = cfg.data || {};
        document.getElementById('configName').textContent = cfg.name;
        document.title = 'MM Chairs — ' + cfg.name;
        renderSettings();
        await loadSongs(_cfgData.song || '');
      } else {
        await loadSongs();
      }
    } catch(e) { await loadSongs(); }
  } else {
    await loadSongs();
  }

  try {
    const s = await fetch('/api/games/chairs/state').then(r => r.json());
    applyState(s);
  } catch(e) { applyState(_state); }
})();
</script>
</body>
</html>
