# MusicMan starter configuration
# System settings (hostname, port, etc.) live in install.yaml — generated by setup script
# This file holds your expedition identity and all show content
# Add circles, roles, macros, and scenes through the Admin UI after first launch

audio:
  default_volume: 80
  fade_duration: 4
  playlist_volume: 70
  preload_all: false
  sfx_volume: 90
  walkup_fade: 3

display:
  logo: default.png
  logo_size: 90
  subtitle: Adventure Guides
  title: My Expedition

expedition:
  logo: ''
  name: My Expedition
  season: ''
  tagline: Adventure Guides

# System defaults — overridden by install.yaml at runtime
system:
  hostname: musicman
  port: 8080
  audio_device: default
  debug: false
  display_enabled: false
  log_level: info
  admin_password: changeme

battery_units: []
circles: []
macros: []
playlist:
  files: []
  loop: true
  shuffle: true
  volume: 70
roles: []
scenes: []
sfx: []
show_flow: []
slides: []
skit_timer_presets: {}
timer:
  active_preset: ''
  duration: 180
  end_display: ''
  end_scene: ''
  end_sound: ''
  show_on_display: true
  start_sound: ''
  start_sound_duration: 6.0
  start_sound_fade: 3.0
  start_sound_start: 0.0
  warning_at: 15
  warning_display: ''
  warning_scene: ''
  warning_sound: ''
wled_devices: []
