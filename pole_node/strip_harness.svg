<svg viewBox="0 0 780 380" width="1560" height="760" xmlns="http://www.w3.org/2000/svg">
<rect width="780" height="380" fill="#1a1a1a"/>

<text x="390" y="22" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ccc">Pole Node — External LED Strip Harness (node → 5 strip segments, 300 LEDs total)</text>
<text x="390" y="36" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">data zig-zags bottom→top through each segment, then a jumper wire carries it back down to the next segment's bottom · power/ground are a shared bus, not chained</text>

<!-- Node connector -->
<rect x="20" y="150" width="70" height="60" fill="#2a1a3a" rx="4" stroke="#8a6ad0" stroke-width="1.5"/>
<text x="55" y="174" text-anchor="middle" font-family="monospace" font-size="8" fill="#b8a0ec" font-weight="bold">POLE NODE</text>
<text x="55" y="187" text-anchor="middle" font-family="monospace" font-size="7" fill="#8a7abb">GX16-5</text>
<text x="55" y="199" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#8a7abb">2×PWR 2×GND 1×DATA</text>

<!-- Power/GND shared bus -->
<line x1="90" y1="165" x2="120" y2="165" stroke="#ff4422" stroke-width="2"/>
<line x1="120" y1="165" x2="120" y2="345" stroke="#ff4422" stroke-width="2"/>
<line x1="90" y1="195" x2="130" y2="195" stroke="#4488ff" stroke-width="2"/>
<line x1="130" y1="195" x2="130" y2="345" stroke="#4488ff" stroke-width="2"/>
<text x="103" y="158" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ff6644">PWR bus</text>
<text x="150" y="205" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#6699ff">GND bus</text>

<!-- Data line from node -->
<line x1="90" y1="180" x2="105" y2="180" stroke="#ffcc00" stroke-width="2.5"/>

<!-- 5 strip segments, each a vertical bar, DIN at bottom, DOUT at top -->
<!-- Segment layout: x positions spaced across the canvas -->
<!-- Seg 1: Stage 1 -->
<rect x="160" y="230" width="60" height="115" fill="#152318" rx="3" stroke="#3a8a3a" stroke-width="1.5"/>
<line x1="190" y1="340" x2="190" y2="250" stroke="#ffcc00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="190" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#7adf9a" font-weight="bold" transform="rotate(-90,190,290)">STAGE 1</text>
<text x="190" y="357" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">0–60</text>

<!-- Seg 2: Stage 2 -->
<rect x="255" y="230" width="60" height="115" fill="#152318" rx="3" stroke="#3a8a3a" stroke-width="1.5"/>
<line x1="285" y1="340" x2="285" y2="250" stroke="#ffcc00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#7adf9a" font-weight="bold" transform="rotate(-90,285,290)">STAGE 2</text>
<text x="285" y="357" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">60–120</text>

<!-- Seg 3: Audience L -->
<rect x="350" y="230" width="60" height="115" fill="#1a1e30" rx="3" stroke="#4a5aaa" stroke-width="1.5"/>
<line x1="380" y1="340" x2="380" y2="250" stroke="#ffcc00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="380" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#8898ee" font-weight="bold" transform="rotate(-90,380,290)">AUDIENCE L</text>
<text x="380" y="357" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">120–180</text>

<!-- Seg 4: Audience C -->
<rect x="445" y="230" width="60" height="115" fill="#1a1e30" rx="3" stroke="#4a5aaa" stroke-width="1.5"/>
<line x1="475" y1="340" x2="475" y2="250" stroke="#ffcc00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#8898ee" font-weight="bold" transform="rotate(-90,475,290)">AUDIENCE C</text>
<text x="475" y="357" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">180–240</text>

<!-- Seg 5: Audience R -->
<rect x="540" y="230" width="60" height="115" fill="#1a1e30" rx="3" stroke="#4a5aaa" stroke-width="1.5"/>
<line x1="570" y1="340" x2="570" y2="250" stroke="#ffcc00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="570" y="290" text-anchor="middle" font-family="monospace" font-size="8" fill="#8898ee" font-weight="bold" transform="rotate(-90,570,290)">AUDIENCE R</text>
<text x="570" y="357" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">240–300</text>

<defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
    <path d="M0,0 L11,5.5 L0,11 z" fill="#ffcc00"/>
  </marker>
</defs>

<!-- Power/GND taps into each segment bottom (parallel, not chained) -->
<line x1="120" y1="345" x2="605" y2="345" stroke="#ff4422" stroke-width="1.5"/>
<line x1="130" y1="352" x2="600" y2="352" stroke="#4488ff" stroke-width="1.5"/>
<line x1="190" y1="345" x2="190" y2="340" stroke="#ff4422" stroke-width="1.5"/>
<line x1="285" y1="345" x2="285" y2="340" stroke="#ff4422" stroke-width="1.5"/>
<line x1="380" y1="345" x2="380" y2="340" stroke="#ff4422" stroke-width="1.5"/>
<line x1="475" y1="345" x2="475" y2="340" stroke="#ff4422" stroke-width="1.5"/>
<line x1="570" y1="345" x2="570" y2="340" stroke="#ff4422" stroke-width="1.5"/>

<!-- Data jumper wires: top of segment N down to bottom of segment N+1 -->
<path d="M 190 235 Q 232 210 232 260 Q 232 340 255 340" fill="none" stroke="#ffcc00" stroke-width="2"/>
<path d="M 285 235 Q 327 210 327 260 Q 327 340 350 340" fill="none" stroke="#ffcc00" stroke-width="2"/>
<path d="M 380 235 Q 422 210 422 260 Q 422 340 445 340" fill="none" stroke="#ffcc00" stroke-width="2"/>
<path d="M 475 235 Q 517 210 517 260 Q 517 340 540 340" fill="none" stroke="#ffcc00" stroke-width="2"/>
<text x="232" y="205" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ccaa00">jumper</text>
<text x="327" y="205" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ccaa00">jumper</text>
<text x="422" y="205" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ccaa00">jumper</text>
<text x="517" y="205" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ccaa00">jumper</text>

<!-- terminated end -->
<circle cx="570" cy="235" r="3" fill="#ffcc00"/>
<text x="600" y="238" text-anchor="start" font-family="monospace" font-size="7" fill="#998800">end — 300th LED</text>

<!-- Zone brackets -->
<text x="237" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#7adf9a" font-weight="bold">◀ STAGE ▶</text>
<text x="475" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#8898ee" font-weight="bold">◀ AUDIENCE ▶</text>

<!-- Legend -->
<rect x="20" y="230" width="130" height="60" fill="#111" rx="3" opacity="0.6"/>
<text x="28" y="243" font-family="monospace" font-size="7" fill="#999" font-weight="bold">LEGEND</text>
<line x1="28" y1="252" x2="42" y2="252" stroke="#ffcc00" stroke-width="2"/>
<text x="47" y="255" font-family="monospace" font-size="6.5" fill="#aaa">data (zig-zag)</text>
<line x1="28" y1="263" x2="42" y2="263" stroke="#ff4422" stroke-width="2"/>
<text x="47" y="266" font-family="monospace" font-size="6.5" fill="#aaa">power (shared)</text>
<line x1="28" y1="274" x2="42" y2="274" stroke="#4488ff" stroke-width="2"/>
<text x="47" y="277" font-family="monospace" font-size="6.5" fill="#aaa">ground (shared)</text>

<text x="20" y="368" font-family="monospace" font-size="6.5" fill="#777">Segment names/counts match the WLED presets on both pole_a and pole_b exactly (Stage 1/2, Audience L/C/R — 60 LEDs each).</text>
</svg>
