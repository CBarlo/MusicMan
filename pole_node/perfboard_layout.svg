<text x="260" y="20" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ccc">Pole Node — 18×24 Perfboard Layout</text>
<text x="260" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">24 cols (long) × 18 rows (short) · 2.54mm pitch · POWER ← left · right → LIGHT</text>
<text x="260" y="47" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">col: 1──2──3────────────────────────────21──22──23──24</text>

<rect x="50" y="50" width="360" height="270" fill="#182e18" rx="4" stroke="#3c6a3c" stroke-width="1.5"/>
