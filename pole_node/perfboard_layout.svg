<text x="385" y="376" font-family="monospace" font-size="7.5" fill="#aaa">Resistors</text>
<text x="60" y="390" font-family="monospace" font-size="7" fill="#777">Data: 74AHCT125 1Y → J2 DATA only. Strips 2–5 chain DOUT→DIN strip-to-strip.</text>
<text x="60" y="401" font-family="monospace" font-size="7" fill="#777">USB slot in left panel wall. INMP441 needs 6mm vent hole in lid directly above.</text>
