<svg viewBox="0 0 520 360" width="1560" height="1080" xmlns="http://www.w3.org/2000/svg">
<rect width="520" height="360" fill="#1a1a1a"/>
<defs>
  <pattern id="h" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="translate(50,50)">
    <circle cx="7.5" cy="7.5" r="1.8" fill="#2a5c2a" opacity="0.85"/>
  </pattern>
</defs>

<text x="260" y="20" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#ccc">Pole Node — Perfboard Layout (ESP32 + MAX485 + level-shifter carrier)</text>
<text x="260" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">component side · matches wiring_backview.svg · POWER ← left · right → LIGHT / OUTPUT</text>

<rect x="50" y="50" width="360" height="230" fill="#182e18" rx="4" stroke="#3c6a3c" stroke-width="1.5"/>
<rect x="50" y="50" width="360" height="230" fill="url(#h)"/>

<rect x="365" y="50" width="45" height="230" fill="#40a8ff" opacity="0.14" rx="2"/>
<text x="388" y="46" text-anchor="middle" font-family="monospace" font-size="8" fill="#40b0ff" font-weight="bold">ANTENNA / OUTPUT END</text>

<line x1="80" y1="57" x2="365" y2="57" stroke="#ff5500" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.65"/>
<text x="220" y="55" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff7733">+5V bus</text>

<line x1="80" y1="273" x2="365" y2="273" stroke="#4466ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.65"/>
<text x="220" y="285" text-anchor="middle" font-family="monospace" font-size="7" fill="#6688ff">GND bus</text>

<!-- POWER IN — from the Tobsun 75W buck converter mounted below in its own compartment, not part of this perfboard -->
<rect x="50" y="95" width="30" height="30" fill="#aa5010" rx="2" stroke="#dd8040" stroke-width="1"/>
<text x="65" y="107" text-anchor="middle" font-family="monospace" font-size="6.5" fill="white" font-weight="bold">5V IN</text>
<text x="65" y="118" text-anchor="middle" font-family="monospace" font-size="6" fill="#ffcc99">from buck</text>
<text x="47" y="103" text-anchor="end" font-family="monospace" font-size="6.5" fill="#ff8030">Tobsun 75W</text>
<text x="47" y="112" text-anchor="end" font-family="monospace" font-size="6.5" fill="#ff8030">DC-DC →</text>

<!-- MAX485 — beside the ESP32, A/B toward the antenna/output end (matches wiring_backview.svg) -->
<rect x="80" y="90" width="95" height="80" fill="#241a3a" rx="3" stroke="#8a6ad0" stroke-width="1.5"/>
<text x="127" y="106" text-anchor="middle" font-family="monospace" font-size="8" fill="#b8a0ec" font-weight="bold">MAX485</text>
<text x="127" y="117" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#8a7abb">hand-wired carrier</text>
<text x="127" y="160" text-anchor="middle" font-family="monospace" font-size="6" fill="#665599">RO·RE·DE·DI·VCC·GND</text>
<text x="88" y="132" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#b8a0ec" font-weight="bold">A</text>
<text x="88" y="148" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#b8a0ec" font-weight="bold">B</text>
<text x="127" y="82" text-anchor="middle" font-family="monospace" font-size="6" fill="#665599">A/B face the antenna end →</text>

<!-- ESP32 — beside MAX485 -->
<rect x="185" y="90" width="130" height="110" fill="#204020" rx="2" stroke="#66cc66" stroke-width="1"/>
<rect x="200" y="108" width="95" height="70" fill="#0e200e" rx="2" stroke="#4aaa4a" stroke-width="0.8"/>
<text x="247" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#88ee88" font-weight="bold">ESP-32</text>
<text x="247" y="156" text-anchor="middle" font-family="monospace" font-size="7" fill="#55bb55">WROOM-32</text>
<rect x="298" y="130" width="7" height="22" fill="#444" rx="1" stroke="#777" stroke-width="0.5"/>
<text x="292" y="145" text-anchor="end" font-family="monospace" font-size="5.5" fill="#bbb">USB</text>

<!-- INMP441 mic -->
<rect x="155" y="205" width="75" height="45" fill="#1a2a5a" rx="2" stroke="#4a5aaa" stroke-width="1"/>
<text x="192" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#8898ee" font-weight="bold">INMP441</text>
<text x="192" y="231" text-anchor="middle" font-family="monospace" font-size="7" fill="#6878cc">I²S mic</text>
<text x="192" y="242" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#ff9944">▲ vent hole</text>

<!-- 74AHCT125 — under the ESP, toward the antenna/output end (matches wiring_backview.svg) -->
<rect x="70" y="205" width="80" height="57" fill="#1a4550" rx="2" stroke="#3a90a0" stroke-width="1"/>
<rect x="76" y="211" width="68" height="45" fill="#102030" rx="1" stroke="#2a6070" stroke-width="0.5"/>
<text x="110" y="230" text-anchor="middle" font-family="monospace" font-size="8" fill="#7ad8e8" font-weight="bold">74AHCT125</text>
<text x="110" y="241" text-anchor="middle" font-family="monospace" font-size="6" fill="#50a8b8">3.3V→5V level shift</text>
<text x="110" y="251" text-anchor="middle" font-family="monospace" font-size="6" fill="#3888a0">1 ch used (strip data),</text>
<text x="110" y="258" text-anchor="middle" font-family="monospace" font-size="6" fill="#3888a0">3 unused</text>
<text x="110" y="200" text-anchor="middle" font-family="monospace" font-size="6" fill="#3888a0">under the ESP, antenna end</text>

<!-- OUTPUT CONNECTORS — matches wiring_backview.svg exactly: one strip, DMX, status LEDs -->
<rect x="365" y="65" width="44" height="16" fill="#1a3a5a" rx="2" stroke="#3a6aaa" stroke-width="1"/>
<text x="387" y="76" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#70aaee">GX16-5</text>
<rect x="365" y="110" width="44" height="16" fill="#2a1a5a" rx="2" stroke="#5a3aaa" stroke-width="1"/>
<text x="387" y="121" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#aa99ee">XLR-3F</text>
<rect x="365" y="155" width="44" height="16" fill="#1a3a3a" rx="2" stroke="#3a8a8a" stroke-width="1"/>
<text x="387" y="166" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#70e0d0">STATUS</text>

<text x="412" y="76" font-family="monospace" font-size="7" fill="#60a8ee">→ WS2811 strip (single run, 5V·GND·DATA)</text>
<text x="412" y="121" font-family="monospace" font-size="7" fill="#9988ee">→ DMX out (A/B from MAX485)</text>
<text x="412" y="166" font-family="monospace" font-size="7" fill="#70e0d0">→ 3× WS2812B status chain (GPIO4)</text>

<!-- Legend -->
<rect x="50" y="290" width="360" height="62" fill="#111" rx="3" opacity="0.6"/>
<text x="60" y="304" font-family="monospace" font-size="8" fill="#999" font-weight="bold">LEGEND</text>
<rect x="60" y="310" width="10" height="8" fill="#241a3a" stroke="#8a6ad0" stroke-width="1"/>
<text x="75" y="318" font-family="monospace" font-size="7" fill="#aaa">MAX485 (hand-wired, not a module — see photo)</text>
<rect x="60" y="322" width="10" height="8" fill="#1a4550" stroke="#3a90a0" stroke-width="1"/>
<text x="75" y="330" font-family="monospace" font-size="7" fill="#aaa">74AHCT125 DIP-14</text>
<rect x="245" y="310" width="10" height="8" fill="#1a2a5a" stroke="#4a5aaa" stroke-width="1"/>
<text x="260" y="318" font-family="monospace" font-size="7" fill="#aaa">INMP441 mic</text>
<rect x="245" y="322" width="10" height="8" fill="#aa5010"/>
<text x="260" y="330" font-family="monospace" font-size="7" fill="#aaa">Power in (from Tobsun buck, off-board)</text>
<text x="60" y="344" font-family="monospace" font-size="6.5" fill="#777">One WS2811 strip output only — no multi-zone JST fan-out. DMX/mic pins: see wiring_backview.svg for exact GPIO map.</text>
</svg>
