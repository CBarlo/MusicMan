<svg viewBox="0 0 520 410" width="3120" height="2460" xmlns="http://www.w3.org/2000/svg">
<rect width="520" height="410" fill="#1a1a1a"/>
<defs>
  <pattern id="h" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="translate(50,50)">
    <circle cx="7.5" cy="7.5" r="1.8" fill="#2a5c2a" opacity="0.85"/>
