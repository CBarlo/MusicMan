<!-- NOTES -->
<line x1="20" y1="342" x2="500" y2="342" stroke="#222" stroke-width="0.5"/>
<text x="20" y="355" font-family="monospace" font-size="7" fill="#777">• Strip holes: PG7 cable glands or bare 8mm holes with heat-shrink strain relief for JST-SM pigtails</text>
<text x="20" y="367" font-family="monospace" font-size="7" fill="#777">• USB access: slot in the LONG WALL of enclosure, aligned to PCB USB end (~30mm from power face)</text>
<text x="20" y="379" font-family="monospace" font-size="7" fill="#777">• Buck trimpot: small access hole in lid above buck (pre-set to 5.0V, then seal with tape)</text>
<text x="20" y="391" font-family="monospace" font-size="7" fill="#777">• Vent slots: 4–6 slots (2×10mm) in long wall near buck converter for heat dissipation</text>
<text x="20" y="403" font-family="monospace" font-size="7" fill="#777">• Standoffs: 4× M3 brass inserts for PCB (3mm height), 4× M3 for buck board</text>
<text x="20" y="415" font-family="monospace" font-size="7" fill="#777">• PCB orientation: lighting connectors face LIGHT face, USB end faces POWER face</text>
</svg>
